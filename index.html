<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Alicia AI</title>


<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<style>

:root {

    --bg: #05070a;

    --bg2: #080c11;

    --panel: rgba(10, 15, 22, .82);

    --panel2: rgba(14, 20, 29, .9);

    --cyan: #5ee7ff;

    --cyan2: #1fb8ff;

    --cyan3: #8df1ff;

    --text: #e8f7ff;

    --muted: #70818e;

    --border: rgba(94, 231, 255, .13);

    --user: rgba(25, 45, 58, .75);

    --ai: rgba(8, 15, 22, .92);

    --shadow:
        0 0 35px rgba(31, 184, 255, .08),
        inset 0 0 30px rgba(94, 231, 255, .015);
}


* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;

    height: 100%;

    margin: 0;
}


body {

    overflow: hidden;

    background:
        radial-gradient(
            circle at 70% 15%,
            rgba(31,184,255,.07),
            transparent 25%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(94,231,255,.035),
            transparent 25%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        sans-serif;
}


.background-grid {

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .22;

    background-image:
        linear-gradient(
            rgba(94,231,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(94,231,255,.025) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}


.scanline {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 100;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.008) 4px
        );
}


.app {

    position: relative;

    display: flex;

    width: 100%;

    height: 100%;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {

    position: relative;

    width: 290px;

    height: 100%;

    display: flex;

    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            rgba(7,12,18,.96),
            rgba(4,7,11,.98)
        );

    border-right:
        1px solid var(--border);

    backdrop-filter:
        blur(25px);

    z-index: 20;
}


.brand {

    height: 92px;

    display: flex;

    align-items: center;

    gap: 14px;

    padding:
        0 24px;

    border-bottom:
        1px solid
        rgba(94,231,255,.08);
}


.logo {

    width: 43px;

    height: 43px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(94,231,255,.5);

    border-radius: 12px;

    color:
        var(--cyan);

    font-family:
        Orbitron,
        sans-serif;

    font-size: 17px;

    box-shadow:
        0 0 20px
        rgba(94,231,255,.14),
        inset 0 0 14px
        rgba(94,231,255,.06);

    position: relative;
}


.logo::after {

    content: "";

    position: absolute;

    inset: -5px;

    border:
        1px solid
        rgba(94,231,255,.08);

    border-radius: 15px;
}


.brand-name {

    font-family:
        Orbitron,
        sans-serif;

    font-size: 18px;

    letter-spacing: 3px;
}


.brand-sub {

    margin-top: 4px;

    font-size: 9px;

    letter-spacing: 2px;

    color:
        var(--muted);
}


/* =========================
   NEW CHAT
========================= */

.new-chat {

    margin:
        20px;

    height: 48px;

    border:
        1px solid
        rgba(94,231,255,.24);

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.08),
            rgba(94,231,255,.02)
        );

    color:
        var(--cyan3);

    font-family:
        Inter,
        sans-serif;

    font-weight: 600;

    cursor: pointer;

    transition: .25s;
}


.new-chat:hover {

    border-color:
        rgba(94,231,255,.55);

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.15),
            rgba(94,231,255,.04)
        );

    box-shadow:
        0 0 25px
        rgba(94,231,255,.08);

    transform:
        translateY(-1px);
}


/* =========================
   CONVERSACIONES
========================= */

.section-title {

    padding:
        4px 22px 12px;

    color:
        #50616d;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 2px;
}


.conversations {

    flex: 1;

    overflow-y: auto;

    padding:
        0 10px 20px;
}


.conversations::-webkit-scrollbar,
.messages::-webkit-scrollbar {

    width: 5px;
}


.conversations::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb {

    background:
        rgba(94,231,255,.12);

    border-radius: 10px;
}


.conversation {

    position: relative;

    display: flex;

    align-items: center;

    min-height: 48px;

    padding:
        0 13px;

    margin-bottom: 4px;

    border-radius: 8px;

    color:
        #7f929f;

    cursor: pointer;

    transition: .2s;
}


.conversation:hover {

    background:
        rgba(94,231,255,.045);

    color:
        #cceef7;
}


.conversation.active {

    background:
        linear-gradient(
            90deg,
            rgba(94,231,255,.11),
            rgba(94,231,255,.025)
        );

    color:
        var(--cyan3);

    border-left:
        2px solid
        var(--cyan);
}


.conversation-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}


.conversation-actions {

    margin-left: auto;

    display: flex;

    gap: 3px;

    opacity: 0;
}


.conversation:hover
.conversation-actions {

    opacity: 1;
}


.small-action {

    width: 25px;

    height: 25px;

    border: 0;

    border-radius: 6px;

    background:
        rgba(255,255,255,.04);

    color:
        #80929e;

    cursor: pointer;
}


.small-action:hover {

    color: white;

    background:
        rgba(255,255,255,.09);
}


/* =========================
   STATUS
========================= */

.system-status {

    padding:
        17px 21px;

    border-top:
        1px solid
        rgba(94,231,255,.07);

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        #657984;

    font-size: 10px;

    letter-spacing: 1px;
}


.status-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        #3fffb0;

    box-shadow:
        0 0 8px
        #3fffb0;

    animation:
        pulse 2s infinite;
}


@keyframes pulse {

    0%,100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
   MAIN
========================= */

.main {

    position: relative;

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;
}


/* =========================
   HEADER
========================= */

.header {

    height: 78px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 30px;

    border-bottom:
        1px solid
        rgba(94,231,255,.07);

    background:
        rgba(5,8,12,.6);

    backdrop-filter:
        blur(20px);

    z-index: 10;
}


.header-left {

    display: flex;

    align-items: center;

    gap: 14px;
}


.core {

    position: relative;

    width: 11px;

    height: 11px;

    border-radius: 50%;

    background:
        var(--cyan);

    box-shadow:
        0 0 8px
        var(--cyan),
        0 0 22px
        rgba(94,231,255,.55);
}


.core::before,
.core::after {

    content: "";

    position: absolute;

    inset: -7px;

    border:
        1px solid
        rgba(94,231,255,.25);

    border-radius: 50%;

    animation:
        orbit 3s linear infinite;
}


.core::after {

    inset: -12px;

    opacity: .35;

    animation-duration: 5s;
}


@keyframes orbit {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


.header-title {

    font-family:
        Orbitron,
        sans-serif;

    font-size: 14px;

    letter-spacing: 2px;
}


.header-state {

    margin-top: 4px;

    font-size: 9px;

    color:
        #5d7480;

    letter-spacing: 1.5px;
}


.header-right {

    display: flex;

    align-items: center;

    gap: 20px;

    color:
        #5e727e;

    font-size: 10px;

    letter-spacing: 1px;
}


/* =========================
   VOZ
========================= */

.voice-control {

    display: flex;

    align-items: center;

    gap: 8px;

    color:
        #5e727e;

    font-size: 9px;

    letter-spacing: 1px;
}


.voice-toggle {

    width: 34px;

    height: 18px;

    position: relative;

    border:
        1px solid
        rgba(94,231,255,.2);

    border-radius: 20px;

    background:
        rgba(94,231,255,.03);

    cursor: pointer;
}


.voice-toggle::after {

    content: "";

    position: absolute;

    top: 3px;

    left: 3px;

    width: 10px;

    height: 10px;

    border-radius: 50%;

    background:
        #54636c;

    transition: .2s;
}


.voice-toggle.active {

    border-color:
        rgba(94,231,255,.5);

    box-shadow:
        0 0 12px
        rgba(94,231,255,.12);
}


.voice-toggle.active::after {

    left: 19px;

    background:
        var(--cyan);

    box-shadow:
        0 0 8px
        var(--cyan);
}


/* =========================
   CHAT
========================= */

.messages {

    flex: 1;

    overflow-y: auto;

    padding:
        35px
        clamp(20px, 7vw, 100px)
        30px;

    scroll-behavior: smooth;
}


.message {

    display: flex;

    width: 100%;

    margin-bottom: 27px;

    animation:
        messageIn .25s ease;
}


@keyframes messageIn {

    from {

        opacity: 0;

        transform:
            translateY(7px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.message.user {

    justify-content:
        flex-end;
}


.message.assistant {

    justify-content:
        flex-start;
}


.message-content {

    max-width:
        min(760px, 80%);

    padding:
        16px 19px;

    line-height: 1.65;

    font-size: 14px;

    border:
        1px solid
        rgba(94,231,255,.07);

    border-radius: 14px;

    white-space:
        pre-wrap;

    box-shadow:
        var(--shadow);
}


.message.user
.message-content {

    background:
        linear-gradient(
            135deg,
            rgba(28,52,67,.75),
            rgba(12,25,33,.85)
        );

    border-bottom-right-radius:
        4px;
}


.message.assistant
.message-content {

    background:
        linear-gradient(
            135deg,
            rgba(8,15,22,.9),
            rgba(7,12,18,.75)
        );

    border-left:
        2px solid
        rgba(94,231,255,.45);

    border-bottom-left-radius:
        4px;
}


.message-label {

    margin-bottom: 7px;

    color:
        #55717e;

    font-family:
        Orbitron,
        sans-serif;

    font-size: 8px;

    letter-spacing: 2px;
}


.message-tools {

    display: flex;

    justify-content:
        flex-start;

    gap: 5px;

    margin-top: 8px;
}


.speak-message {

    width: 25px;

    height: 25px;

    border:
        1px solid
        rgba(94,231,255,.1);

    border-radius: 6px;

    background:
        rgba(94,231,255,.025);

    color:
        #59747f;

    cursor: pointer;

    font-size: 10px;
}


.speak-message:hover {

    color:
        var(--cyan);

    border-color:
        rgba(94,231,255,.35);
}


/* =========================
   EMPTY
========================= */

.empty {

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


.empty-inner {

    max-width:
        620px;
}


.empty-orb {

    width: 110px;

    height: 110px;

    margin:
        0 auto 30px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(94,231,255,.25);

    border-radius: 50%;

    box-shadow:
        0 0 35px
        rgba(94,231,255,.06),
        inset 0 0 35px
        rgba(94,231,255,.05);

    position: relative;

    animation:
        floating 4s
        ease-in-out
        infinite;
}


.empty-orb::before,
.empty-orb::after {

    content: "";

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(94,231,255,.16);
}


.empty-orb::before {

    inset: -13px;
}


.empty-orb::after {

    inset: 13px;
}


.orb-letter {

    font-family:
        Orbitron,
        sans-serif;

    font-size: 35px;

    color:
        var(--cyan);

    text-shadow:
        0 0 25px
        rgba(94,231,255,.55);
}


@keyframes floating {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-7px);
    }
}


.empty h1 {

    margin: 0;

    font-family:
        Orbitron,
        sans-serif;

    font-size: 27px;

    font-weight: 500;

    letter-spacing: 4px;
}


.empty p {

    margin-top: 14px;

    color:
        #647985;

    font-size: 13px;

    line-height: 1.7;
}


/* =========================
   INICIADORES
========================= */

.start-options {

    display: flex;

    justify-content:
        center;

    flex-wrap: wrap;

    gap: 8px;

    margin:
        0 auto 18px;
}


.start-option {

    padding:
        9px 13px;

    border:
        1px solid
        rgba(94,231,255,.12);

    border-radius: 8px;

    background:
        rgba(94,231,255,.025);

    color:
        #71909c;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;
}


.start-option:hover {

    color:
        var(--cyan3);

    border-color:
        rgba(94,231,255,.35);

    background:
        rgba(94,231,255,.07);

    transform:
        translateY(-1px);
}


/* =========================
   INPUT
========================= */

.input-area {

    padding:
        15px
        clamp(20px, 7vw, 100px)
        22px;

    background:
        linear-gradient(
            to top,
            rgba(5,7,10,.98),
            rgba(5,7,10,.75)
        );

    border-top:
        1px solid
        rgba(94,231,255,.06);
}


.input-shell {

    position: relative;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    max-width:
        950px;

    margin:
        auto;

    padding: 9px;

    border:
        1px solid
        rgba(94,231,255,.14);

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(12,19,27,.94),
            rgba(6,10,15,.96)
        );

    box-shadow:
        0 0 35px
        rgba(94,231,255,.035),
        inset 0 0 25px
        rgba(94,231,255,.015);

    transition: .25s;
}


.input-shell:focus-within {

    border-color:
        rgba(94,231,255,.38);

    box-shadow:
        0 0 35px
        rgba(94,231,255,.08),
        inset 0 0 20px
        rgba(94,231,255,.025);
}


textarea {

    flex: 1;

    min-height: 44px;

    max-height: 180px;

    resize: none;

    padding:
        12px 10px;

    border: 0;

    outline: 0;

    background:
        transparent;

    color:
        #e8f7ff;

    font-family:
        Inter,
        sans-serif;

    font-size: 14px;

    line-height: 1.5;
}


textarea::placeholder {

    color:
        #536773;
}


.input-button {

    flex-shrink: 0;

    width: 42px;

    height: 42px;

    border:
        1px solid
        rgba(94,231,255,.16);

    border-radius: 10px;

    background:
        rgba(94,231,255,.045);

    color:
        #75909d;

    cursor: pointer;

    transition: .2s;

    font-size: 16px;
}


.input-button:hover {

    color:
        var(--cyan);

    border-color:
        rgba(94,231,255,.4);

    background:
        rgba(94,231,255,.1);
}


.send-button {

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.18),
            rgba(31,184,255,.08)
        );

    color:
        var(--cyan3);

    border-color:
        rgba(94,231,255,.3);
}


.send-button:hover {

    box-shadow:
        0 0 20px
        rgba(94,231,255,.15);
}


/* =========================
   FILE PREVIEW
========================= */

.file-preview {

    display: none;

    max-width:
        950px;

    margin:
        0 auto 8px;

    padding: 9px;

    border:
        1px solid
        rgba(94,231,255,.14);

    border-radius: 10px;

    background:
        rgba(7,13,19,.85);

    align-items:
        center;

    gap: 10px;
}


.file-preview.visible {

    display: flex;
}


.file-preview-image {

    width: 48px;

    height: 48px;

    object-fit: cover;

    border-radius: 7px;

    border:
        1px solid
        rgba(94,231,255,.2);
}


.file-preview-icon {

    width: 48px;

    height: 48px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(94,231,255,.15);

    border-radius: 7px;

    color:
        var(--cyan);

    font-family:
        Orbitron,
        sans-serif;

    font-size: 12px;
}


.file-info {

    min-width: 0;

    flex: 1;
}


.file-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color:
        #cceef7;

    font-size: 12px;
}


.file-meta {

    margin-top: 4px;

    color:
        #58717d;

    font-size: 9px;

    letter-spacing: .5px;
}


.remove-file {

    width: 30px;

    height: 30px;

    border:
        1px solid
        rgba(94,231,255,.08);

    border-radius: 7px;

    background:
        rgba(255,255,255,.02);

    color:
        #647984;

    cursor: pointer;
}


.remove-file:hover {

    color:
        #ff7180;

    border-color:
        rgba(255,113,128,.25);
}


.footer-info {

    max-width:
        950px;

    margin:
        8px auto 0;

    text-align:
        center;

    color:
        #334852;

    font-size: 9px;

    letter-spacing: .5px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .sidebar {
        width: 230px;
    }

    .messages {

        padding-left:
            20px;

        padding-right:
            20px;
    }

    .input-area {

        padding-left:
            15px;

        padding-right:
            15px;
    }

    .header {

        padding:
            0 18px;
    }

    .header-right {

        gap: 8px;
    }

    .voice-control span {

        display: none;
    }
}


@media (max-width: 600px) {

    .sidebar {

        display: none;
    }

    .message-content {

        max-width: 92%;
    }

    .header-right > span:last-child {

        display: none;
    }
}

</style>

</head>


<body>

<div class="background-grid"></div>

<div class="scanline"></div>


<div class="app">


<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">


    <div class="brand">

        <div class="logo">
            A
        </div>

        <div>

            <div class="brand-name">
                ALICIA
            </div>

            <div class="brand-sub">
                AI SYSTEM
            </div>

        </div>

    </div>


    <button
        class="new-chat"
        id="newChat"
    >
        + NUEVA CONVERSACIÓN
    </button>


    <div class="section-title">
        CONVERSACIONES
    </div>


    <div
        class="conversations"
        id="conversations"
    ></div>


    <div class="system-status">

        <span class="status-dot"></span>

        SISTEMA ONLINE

    </div>


</aside>


<!-- =====================================================
     MAIN
====================================================== -->

<main class="main">


<header class="header">


    <div class="header-left">

        <div class="core"></div>

        <div>

            <div class="header-title">
                ALICIA
            </div>

            <div class="header-state">
                ALICIA · SISTEMA AUTÓNOMO ACTIVO
            </div>

        </div>

    </div>


    <div class="header-right">


        <div class="voice-control">

            <span>
                VOZ
            </span>

            <div
                class="voice-toggle"
                id="voiceToggle"
                title="Activar o desactivar la voz de Alicia"
            ></div>

        </div>


        <span>
            ALICIA ES ÚNICA
        </span>


        <span>
            v1.0
        </span>


    </div>


</header>


<!-- =====================================================
     MESSAGES
====================================================== -->

<section
    class="messages"
    id="messages"
></section>


<!-- =====================================================
     INPUT
====================================================== -->

<div class="input-area">


    <div
        class="file-preview"
        id="filePreview"
    >

        <div id="filePreviewVisual"></div>

        <div class="file-info">

            <div
                class="file-name"
                id="fileName"
            ></div>

            <div
                class="file-meta"
                id="fileMeta"
            ></div>

        </div>


        <button
            class="remove-file"
            id="removeFile"
            title="Quitar archivo"
        >
            ×
        </button>

    </div>


    <div class="input-shell">


        <button
            class="input-button"
            id="fileButton"
            title="Adjuntar archivo"
        >
            +
        </button>


        <input
            type="file"
            id="fileInput"
            hidden
            accept="image/*,.txt,.md,.json,.csv,.html,.pdf,.docx"
        >


        <button
            class="input-button"
            id="micButton"
            title="Hablar"
        >
            ◉
        </button>


        <textarea
            id="messageInput"
            placeholder="Escribile a Alicia..."
            rows="1"
        ></textarea>


        <button
            class="input-button send-button"
            id="sendButton"
            title="Enviar"
        >
            ➤
        </button>


    </div>


    <div class="footer-info">
        ALICIA · UNA PRESENCIA PROPIA · CONVERSACIÓN PRIVADA
    </div>


</div>


</main>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


/* =========================================================
   ELEMENTOS
========================================================= */

const messagesEl =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const newChatButton =
    document.getElementById(
        "newChat"
    );

const conversationsEl =
    document.getElementById(
        "conversations"
    );

const fileButton =
    document.getElementById(
        "fileButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const filePreview =
    document.getElementById(
        "filePreview"
    );

const filePreviewVisual =
    document.getElementById(
        "filePreviewVisual"
    );

const fileName =
    document.getElementById(
        "fileName"
    );

const fileMeta =
    document.getElementById(
        "fileMeta"
    );

const removeFile =
    document.getElementById(
        "removeFile"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const voiceToggle =
    document.getElementById(
        "voiceToggle"
    );


/* =========================================================
   ESTADO
========================================================= */

let conversations =
    JSON.parse(
        localStorage.getItem(
            "alicia_conversations"
        ) || "[]"
    );


let activeConversationId =
    localStorage.getItem(
        "alicia_active"
    ) || null;


let selectedFile = null;

let isSending = false;

let initiativeTimer = null;

let initiativeRunning = false;

let lastInitiative =
    Date.now();


/* =========================================================
   VOZ
========================================================= */

let voiceEnabled =
    localStorage.getItem(
        "alicia_voice"
    ) === "true";


function updateVoiceInterface() {

    voiceToggle.classList.toggle(
        "active",
        voiceEnabled
    );
}


updateVoiceInterface();


voiceToggle.onclick = () => {

    voiceEnabled =
        !voiceEnabled;

    localStorage.setItem(
        "alicia_voice",
        voiceEnabled
    );

    updateVoiceInterface();


    if (!voiceEnabled) {

        stopSpeaking();
    }
};


/* =========================================================
   SELECCIÓN DE VOZ
========================================================= */

function getAliciaVoice() {

    if (
        !("speechSynthesis" in window)
    ) {
        return null;
    }


    const voices =
        speechSynthesis.getVoices();


    if (!voices.length) {
        return null;
    }


    const spanish =
        voices.filter(
            voice =>
                voice.lang
                    ?.toLowerCase()
                    .startsWith("es")
        );


    if (!spanish.length) {

        return voices[0];
    }


    /*
       Intentamos primero voces que
       suelen corresponder a voces
       femeninas en sistemas comunes.
    */

    const femaleNames = [

        "helena",

        "sabrina",

        "sabina",

        "elena",

        "paulina",

        "monica",

        "monica",

        "luciana",

        "sofia",

        "isabela",

        "isabella",

        "female",

        "mujer"

    ];


    const femaleVoice =
        spanish.find(
            voice => {

                const name =
                    voice.name
                        .toLowerCase();

                return femaleNames.some(
                    key =>
                        name.includes(
                            key
                        )
                );
            }
        );


    if (femaleVoice) {

        return femaleVoice;
    }


    /*
       Si no podemos identificar
       el género por nombre,
       priorizamos una voz
       española/argentina.
    */

    const argentina =
        spanish.find(
            voice =>
                voice.lang
                    ?.toLowerCase()
                    === "es-ar"
        );


    if (argentina) {
        return argentina;
    }


    return spanish[0];
}


if (
    "speechSynthesis"
    in window
) {

    speechSynthesis.onvoiceschanged =
        () => {
            getAliciaVoice();
        };
}


function speakAlicia(text) {

    if (!voiceEnabled) {
        return;
    }


    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    if (!text?.trim()) {
        return;
    }


    stopSpeaking();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const voice =
        getAliciaVoice();


    if (voice) {

        utterance.voice =
            voice;

        utterance.lang =
            voice.lang;
    } else {

        utterance.lang =
            "es-AR";
    }


    /*
       Valores pensados para que
       no suene como un GPS.
    */

    utterance.rate =
        0.94;

    utterance.pitch =
        1.03;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );
}


function stopSpeaking() {

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();
    }
}


/* =========================================================
   ESTADO
========================================================= */

function saveState() {

    localStorage.setItem(
        "alicia_conversations",
        JSON.stringify(
            conversations
        )
    );

    localStorage.setItem(
        "alicia_active",
        activeConversationId || ""
    );
}


/* =========================================================
   CREAR CONVERSACIÓN
========================================================= */

function createConversation() {

    const conversation = {

        id:
            Date.now().toString(),

        title:
            "Nueva conversación",

        messages: []
    };


    conversations.unshift(
        conversation
    );


    activeConversationId =
        conversation.id;


    saveState();

    renderConversations();

    renderMessages();
}


/* =========================================================
   ACTIVA
========================================================= */

function getActiveConversation() {

    return conversations.find(
        c =>
            c.id ===
            activeConversationId
    );
}


/* =========================================================
   SIDEBAR
========================================================= */

function renderConversations() {

    conversationsEl.innerHTML =
        "";


    for (
        const conversation
        of conversations
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "conversation" +
            (
                conversation.id ===
                activeConversationId
                    ? " active"
                    : ""
            );


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "conversation-name";


        name.textContent =
            conversation.title;


        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "conversation-actions";


        const rename =
            document.createElement(
                "button"
            );


        rename.className =
            "small-action";


        rename.textContent =
            "✎";


        rename.onclick =
            event => {

                event.stopPropagation();


                const newName =
                    prompt(
                        "Nombre de la conversación:",
                        conversation.title
                    );


                if (
                    newName &&
                    newName.trim()
                ) {

                    conversation.title =
                        newName.trim();


                    saveState();

                    renderConversations();
                }
            };


        const remove =
            document.createElement(
                "button"
            );


        remove.className =
            "small-action";


        remove.textContent =
            "×";


        remove.onclick =
            event => {

                event.stopPropagation();


                conversations =
                    conversations.filter(
                        c =>
                            c.id !==
                            conversation.id
                    );


                if (
                    activeConversationId ===
                    conversation.id
                ) {

                    activeConversationId =
                        conversations[0]
                            ?.id ||
                        null;
                }


                saveState();

                renderConversations();

                renderMessages();
            };


        actions.appendChild(
            rename
        );

        actions.appendChild(
            remove
        );


        item.appendChild(
            name
        );

        item.appendChild(
            actions
        );


        item.onclick = () => {

            activeConversationId =
                conversation.id;


            saveState();

            renderConversations();

            renderMessages();
        };


        conversationsEl.appendChild(
            item
        );
    }
}


/* =========================================================
   MENSAJES
========================================================= */

function renderMessages() {

    messagesEl.innerHTML =
        "";


    const conversation =
        getActiveConversation();


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        messagesEl.innerHTML = `

            <div class="empty">

                <div class="empty-inner">


                    <div class="empty-orb">

                        <span class="orb-letter">
                            A
                        </span>

                    </div>


                    <h1>
                        ALICIA
                    </h1>


                    <div class="start-options">


                        <button
                            class="start-option"
                            data-start="Contame algo interesante."
                        >
                            Contame algo
                        </button>


                        <button
                            class="start-option"
                            data-start="Tengo una idea y quiero desarrollarla con vos."
                        >
                            Tengo una idea
                        </button>


                        <button
                            class="start-option"
                            data-start="Quiero conocer tu opinión sobre algo."
                        >
                            Necesito una opinión
                        </button>


                        <button
                            class="start-option"
                            data-start="Sorprendeme con algo que creas que me puede interesar."
                        >
                            Sorprendeme
                        </button>


                    </div>


                    <p>
                        Sistema de inteligencia artificial conectado.<br>
                        Podés hablar conmigo, preguntarme cosas, mandarme imágenes o archivos.
                    </p>


                </div>

            </div>
        `;


        document
            .querySelectorAll(
                ".start-option"
            )
            .forEach(
                button => {

                    button.onclick =
                        () => {

                            input.value =
                                button.dataset.start;

                            autoResize();

                            input.focus();
                        };
                }
            );


        return;
    }


    for (
        const message
        of conversation.messages
    ) {

        addMessageToDOM(
            message.role,
            message.content
        );
    }


    scrollToBottom();
}


/* =========================================================
   MENSAJE DOM
========================================================= */

function addMessageToDOM(
    role,
    content
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message-content";


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "message-label";


    label.textContent =
        role === "user"
            ? "YOU"
            : "ALICIA";


    const text =
        document.createElement(
            "div"
        );


    text.textContent =
        content;


    box.appendChild(
        label
    );


    box.appendChild(
        text
    );


    if (
        role === "assistant"
    ) {

        const tools =
            document.createElement(
                "div"
            );


        tools.className =
            "message-tools";


        const speakButton =
            document.createElement(
                "button"
            );


        speakButton.className =
            "speak-message";


        speakButton.textContent =
            "🔊";


        speakButton.title =
            "Escuchar a Alicia";


        speakButton.onclick =
            () => {

                speakAlicia(
                    content
                );
            };


        tools.appendChild(
            speakButton
        );


        box.appendChild(
            tools
        );
    }


    wrapper.appendChild(
        box
    );


    messagesEl.appendChild(
        wrapper
    );
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    requestAnimationFrame(
        () => {

            messagesEl.scrollTop =
                messagesEl.scrollHeight;
        }
    );
}


/* =========================================================
   ENVIAR
========================================================= */

async function sendMessage() {

    if (isSending) {
        return;
    }


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedFile
    ) {
        return;
    }


    let conversation =
        getActiveConversation();


    if (!conversation) {

        createConversation();

        conversation =
            getActiveConversation();
    }


    isSending = true;

    sendButton.disabled =
        true;


    let imageData =
        null;


    /* =========================
       IMAGEN
    ========================= */

    if (
        selectedFile &&
        selectedFile.type
            .startsWith("image/")
    ) {

        imageData =
            await fileToDataURL(
                selectedFile
            );
    }


    /* =========================
       TEXTO DEL ARCHIVO
    ========================= */

    let finalText =
        text;


    if (
        selectedFile &&
        !selectedFile.type
            .startsWith("image/")
    ) {

        /*
           De momento le informamos
           a Alicia qué archivo recibió.
           La previsualización ocurre
           antes del envío.
        */

        finalText +=
            (
                finalText
                    ? "\n\n"
                    : ""
            ) +
            "[Archivo adjunto: " +
            selectedFile.name +
            "]";
    }


    if (
        !finalText.trim() &&
        imageData
    ) {

        finalText =
            "Analizá esta imagen.";
    }


    /* =========================
       MENSAJE USUARIO
    ========================= */

    conversation.messages.push({

        role: "user",

        content:
            finalText
    });


    if (
        conversation.title ===
        "Nueva conversación"
    ) {

        conversation.title =
            finalText
                .slice(0, 35)
                .trim() +
            (
                finalText.length > 35
                    ? "..."
                    : ""
            );
    }


    saveState();

    renderConversations();

    renderMessages();


    input.value = "";

    autoResize();


    /*
       Evitamos que Alicia
       inicie inmediatamente
       después del mensaje.
    */

    lastInitiative =
        Date.now();


    const history =
        conversation.messages
            .slice(0, -1)
            .slice(-30);


    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                finalText,

                            image:
                                imageData,

                            history:
                                history
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "Error de conexión."
            );
        }


        const answer =
            data.response ||
            "No recibí una respuesta.";


        conversation.messages.push({

            role:
                "assistant",

            content:
                answer
        });


        saveState();

        renderMessages();


        /*
           Si la voz está activa,
           Alicia habla automáticamente.
        */

        speakAlicia(
            answer
        );


    } catch (error) {

        console.error(
            error
        );


        const errorMessage =
            "No pude conectarme con mi cerebro ahora mismo.\n\nDetalle: " +
            error.message;


        conversation.messages.push({

            role:
                "assistant",

            content:
                errorMessage
        });


        saveState();

        renderMessages();
    }


    clearSelectedFile();


    isSending =
        false;

    sendButton.disabled =
        false;
}


/* =========================================================
   ARCHIVOS
========================================================= */

fileButton.onclick =
    () => {

        fileInput.click();
    };


fileInput.onchange =
    () => {

        const file =
            fileInput.files?.[0];


        if (!file) {
            return;
        }


        selectedFile =
            file;


        showFilePreview(
            file
        );
    };


/* =========================================================
   PREVISUALIZACIÓN
========================================================= */

function showFilePreview(
    file
) {

    filePreviewVisual.innerHTML =
        "";


    fileName.textContent =
        file.name;


    fileMeta.textContent =
        formatFileSize(
            file.size
        ) +
        " · " +
        (
            file.type ||
            "Archivo"
        );


    if (
        file.type.startsWith(
            "image/"
        )
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.className =
            "file-preview-image";


        image.alt =
            "Vista previa";


        const reader =
            new FileReader();


        reader.onload =
            event => {

                image.src =
                    event.target.result;
            };


        reader.readAsDataURL(
            file
        );


        filePreviewVisual.appendChild(
            image
        );


    } else {

        const icon =
            document.createElement(
                "div"
            );


        icon.className =
            "file-preview-icon";


        icon.textContent =
            getFileExtension(
                file.name
            );


        filePreviewVisual.appendChild(
            icon
        );
    }


    filePreview.classList.add(
        "visible"
    );
}


/* =========================================================
   QUITAR ARCHIVO
========================================================= */

removeFile.onclick =
    clearSelectedFile;


function clearSelectedFile() {

    selectedFile =
        null;


    fileInput.value =
        "";


    filePreview.classList.remove(
        "visible"
    );


    filePreviewVisual.innerHTML =
        "";


    fileName.textContent =
        "";


    fileMeta.textContent =
        "";
}


/* =========================================================
   TAMAÑO
========================================================= */

function formatFileSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes +
            " B";
    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";
    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1) +
    " MB";
}


/* =========================================================
   EXTENSIÓN
========================================================= */

function getFileExtension(
    filename
) {

    const parts =
        filename
            .split(".");


    if (
        parts.length < 2
    ) {

        return "FILE";
    }


    return parts
        .pop()
        .toUpperCase()
        .slice(0, 5);
}


/* =========================================================
   DATA URL
========================================================= */

function fileToDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );
        }
    );
}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResize() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) +
        "px";
}


input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   ENVIAR
========================================================= */

sendButton.onclick =
    sendMessage;


/* =========================================================
   NUEVO CHAT
========================================================= */

newChatButton.onclick =
    createConversation;


/* =========================================================
   RECONOCIMIENTO DE VOZ
========================================================= */

let recognition =
    null;


if (
    "webkitSpeechRecognition"
    in window ||
    "SpeechRecognition"
    in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "es-AR";


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    recognition.onresult =
        event => {

            input.value =
                event
                    .results[0][0]
                    .transcript;


            autoResize();
        };


    recognition.onstart =
        () => {

            micButton.style.color =
                "#5ee7ff";

            micButton.style.boxShadow =
                "0 0 18px rgba(94,231,255,.25)";
        };


    recognition.onend =
        () => {

            micButton.style.color =
                "";

            micButton.style.boxShadow =
                "";
        };
}


micButton.onclick =
    () => {

        if (!recognition) {

            alert(
                "El reconocimiento de voz no está disponible en este navegador."
            );

            return;
        }


        recognition.start();
    };


/* =========================================================
   INICIATIVA DE ALICIA
========================================================= */

function scheduleInitiative() {

    clearTimeout(
        initiativeTimer
    );


    /*
       Entre 2 y 5 minutos.

       No significa que Alicia
       vaya a hablar en ese momento.
       Solo significa que en ese
       momento puede preguntarle
       a Gemini si tiene algo
       genuino que decir.
    */

    const delay =
        120000 +
        Math.random() * 180000;


    initiativeTimer =
        setTimeout(
            checkInitiative,
            delay
        );
}


async function checkInitiative() {

    if (
        initiativeRunning
    ) {

        scheduleInitiative();

        return;
    }


    const conversation =
        getActiveConversation();


    if (
        !conversation ||
        conversation.messages.length < 2
    ) {

        scheduleInitiative();

        return;
    }


    if (
        Date.now() -
        lastInitiative <
        120000
    ) {

        scheduleInitiative();

        return;
    }


    initiativeRunning =
        true;


    try {

        const history =
            conversation.messages
                .slice(-30);


        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            initiative:
                                true,

                            history:
                                history
                        })
                }
            );


        const data =
            await response.json();


        if (
            data?.ok &&
            data?.response
        ) {

            const answer =
                data.response.trim();


            if (
                answer &&
                answer !==
                "NO_INITIATIVE"
            ) {

                /*
                   Verificamos que no sea
                   exactamente el último
                   mensaje de Alicia.
                */

                const lastMessage =
                    conversation
                        .messages[
                            conversation
                                .messages
                                .length - 1
                        ];


                if (
                    !lastMessage ||
                    lastMessage.content
                        !== answer
                ) {

                    conversation.messages.push({

                        role:
                            "assistant",

                        content:
                            answer
                    });


                    saveState();

                    renderMessages();


                    /*
                       Si el usuario habilitó
                       la voz, Alicia también
                       puede hablar por iniciativa.
                    */

                    speakAlicia(
                        answer
                    );
                }


                lastInitiative =
                    Date.now();
            }
        }

    } catch (error) {

        console.error(
            "Alicia initiative:",
            error
        );

    } finally {

        initiativeRunning =
            false;


        scheduleInitiative();
    }
}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

if (
    conversations.length ===
    0
) {

    createConversation();

} else {

    if (
        !activeConversationId ||
        !getActiveConversation()
    ) {

        activeConversationId =
            conversations[0].id;

        saveState();
    }


    renderConversations();

    renderMessages();
}


scheduleInitiative();

</script>

</body>
</html>
