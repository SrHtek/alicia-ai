<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alicia AI</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07090d;
    --panel: #0c1017;
    --panel2: #10151e;
    --border: #1d2733;
    --cyan: #5ee7ff;
    --cyan2: #2dbedb;
    --text: #e9f1f5;
    --muted: #7e8b96;
    --danger: #ff5555;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 280px;
    min-width: 280px;
    height: 100vh;

    background:
        linear-gradient(
            180deg,
            #0a0e14 0%,
            #070a0f 100%
        );

    border-right:
        1px solid var(--border);

    display: flex;
    flex-direction: column;
}

.logo {
    padding: 25px 22px 20px;

    font-size: 23px;
    font-weight: 700;

    letter-spacing: 1px;

    color: var(--cyan);
}

.new-chat {
    margin: 0 15px 15px;

    padding: 12px 14px;

    border: 1px solid #24323f;
    border-radius: 10px;

    background: #101721;
    color: var(--text);

    cursor: pointer;

    transition: .2s;
}

.new-chat:hover {
    border-color: var(--cyan2);
    background: #131e29;
}

.conversations {
    flex: 1;

    overflow-y: auto;

    padding: 5px 10px 15px;
}

.conversation {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 11px 12px;
    margin-bottom: 5px;

    border-radius: 8px;

    color: #bac5cc;

    cursor: pointer;

    transition: .2s;
}

.conversation:hover {
    background: #101720;
}

.conversation.active {
    background: #111d27;
    color: var(--cyan);
}

.conversation-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    flex: 1;
}

.conversation-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
}

.conversation:hover .conversation-actions {
    opacity: 1;
}

.conversation-actions button {
    border: none;
    background: transparent;
    color: #77838c;
    cursor: pointer;
}

.conversation-actions button:hover {
    color: var(--cyan);
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    height: 100vh;

    display: flex;
    flex-direction: column;

    min-width: 0;
}

/* =========================
   HEADER
========================= */

.header {
    height: 65px;
    min-height: 65px;

    display: flex;
    align-items: center;

    padding: 0 24px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(8, 11, 16, .88);

    backdrop-filter: blur(12px);
}

.header-title {
    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 600;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 10px rgba(94,231,255,.7);
}

.header-status {
    color: var(--muted);
    font-size: 12px;
}

/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 30px 7%;
}

.message {
    width: 100%;

    display: flex;

    margin-bottom: 22px;
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.message-bubble {
    max-width: min(760px, 85%);

    padding: 13px 16px;

    border-radius: 13px;

    line-height: 1.55;

    font-size: 15px;

    white-space: pre-wrap;

    word-break: break-word;
}

.message.user .message-bubble {
    background: #14212b;

    border:
        1px solid #1e3542;
}

.message.assistant .message-bubble {
    background: #0d131b;

    border:
        1px solid #18232d;
}

.message-label {
    font-size: 11px;

    color: var(--muted);

    margin-bottom: 5px;
}

.message.user .message-label {
    text-align: right;
}

/* =========================
   WELCOME
========================= */

.welcome {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    color: var(--muted);
}

.welcome h1 {
    color: var(--cyan);

    font-size: 38px;

    margin: 0 0 8px;
}

.welcome p {
    margin: 0;

    max-width: 500px;
}

/* =========================
   INPUT
========================= */

.input-area {
    padding: 14px 7% 20px;

    border-top:
        1px solid var(--border);

    background:
        rgba(7, 9, 13, .94);
}

.input-wrapper {
    max-width: 900px;

    margin: auto;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding: 9px;

    background: #0d131a;

    border:
        1px solid #202c37;

    border-radius: 14px;
}

#messageInput {
    flex: 1;

    resize: none;

    min-height: 42px;
    max-height: 160px;

    padding: 10px 11px;

    border: none;
    outline: none;

    background: transparent;

    color: var(--text);

    font-family: inherit;
    font-size: 15px;
}

#messageInput::placeholder {
    color: #59656f;
}

.input-button {
    width: 42px;
    height: 42px;

    border-radius: 10px;

    border: 1px solid #263744;

    background: #111b24;

    color: var(--cyan);

    cursor: pointer;

    transition: .2s;
}

.input-button:hover {
    background: #172733;
    border-color: var(--cyan2);
}

.input-button:disabled {
    opacity: .4;
    cursor: default;
}

/* =========================
   FILE
========================= */

.file-preview {
    max-width: 900px;

    margin: 0 auto 8px;

    display: none;

    padding: 8px 11px;

    border:
        1px solid #26343f;

    border-radius: 9px;

    background: #0d131a;

    font-size: 13px;

    color: var(--muted);
}

.file-preview.visible {
    display: flex;

    align-items: center;
    justify-content: space-between;
}

.file-remove {
    border: none;

    background: transparent;

    color: var(--danger);

    cursor: pointer;
}

/* =========================
   TYPING
========================= */

.typing {
    display: flex;

    align-items: center;

    gap: 5px;

    padding: 4px 2px;
}

.typing span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--cyan);

    animation:
        typingAnimation 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typingAnimation {

    0%,
    60%,
    100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #202c36;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #2c3d49;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 220px;
        min-width: 220px;
    }

    .messages {
        padding: 20px 4%;
    }

    .input-area {
        padding: 10px 4% 15px;
    }

    .message-bubble {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            ALICIA
        </div>

        <button
            class="new-chat"
            id="newChatButton"
        >
            + Nueva conversación
        </button>

        <div
            class="conversations"
            id="conversationList"
        ></div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="header">

            <div class="header-title">

                <div class="status-dot"></div>

                <div>
                    Alicia
                    <div
                        class="header-status"
                        id="headerStatus"
                    >
                        En línea
                    </div>
                </div>

            </div>

        </header>


        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
        ></section>


        <!-- INPUT -->

        <div class="input-area">

            <div
                class="file-preview"
                id="filePreview"
            >

                <span id="fileName">
                    Archivo
                </span>

                <button
                    class="file-remove"
                    id="removeFile"
                >
                    ×
                </button>

            </div>

            <div class="input-wrapper">

                <button
                    class="input-button"
                    id="fileButton"
                    title="Adjuntar archivo"
                >
                    +
                </button>

                <input
                    type="file"
                    id="fileInput"
                    hidden
                    accept="
                        image/*,
                        .txt,
                        .md,
                        .json,
                        .csv,
                        .html,
                        .pdf,
                        .docx
                    "
                >

                <textarea
                    id="messageInput"
                    placeholder="Escribile a Alicia..."
                    rows="1"
                ></textarea>

                <button
                    class="input-button"
                    id="sendButton"
                    title="Enviar"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


/* =========================================================
   ESTADO
========================================================= */

let conversations = [];

let activeConversationId = null;

let selectedFile = null;

let selectedImage = null;

let aliciaInitiativeRunning = false;

let aliciaInitiativeTimer = null;

let aliciaLastInitiative = 0;


/* =========================================================
   ELEMENTOS
========================================================= */

const conversationList =
    document.getElementById(
        "conversationList"
    );

const messagesElement =
    document.getElementById(
        "messages"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const fileButton =
    document.getElementById(
        "fileButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const filePreview =
    document.getElementById(
        "filePreview"
    );

const fileName =
    document.getElementById(
        "fileName"
    );

const removeFile =
    document.getElementById(
        "removeFile"
    );

const newChatButton =
    document.getElementById(
        "newChatButton"
    );

const headerStatus =
    document.getElementById(
        "headerStatus"
    );


/* =========================================================
   STORAGE
========================================================= */

function saveConversations() {

    try {

        localStorage.setItem(
            "alicia_conversations",
            JSON.stringify(
                conversations
            )
        );

    } catch (error) {

        console.error(
            "No se pudieron guardar las conversaciones:",
            error
        );
    }
}


function loadConversations() {

    try {

        const saved =
            localStorage.getItem(
                "alicia_conversations"
            );

        if (saved) {

            conversations =
                JSON.parse(saved);

        }

    } catch (error) {

        console.error(
            "Error cargando conversaciones:",
            error
        );

        conversations = [];
    }

    if (
        !Array.isArray(
            conversations
        )
    ) {

        conversations = [];
    }

    if (
        conversations.length === 0
    ) {

        createConversation();

    } else {

        activeConversationId =
            conversations[0].id;

        renderConversations();
        renderMessages();
    }
}


/* =========================================================
   CONVERSACIONES
========================================================= */

function createConversation() {

    const conversation = {

        id:
            Date.now().toString(),

        title:
            "Nueva conversación",

        messages: []

    };

    conversations.unshift(
        conversation
    );

    activeConversationId =
        conversation.id;

    saveConversations();

    renderConversations();
    renderMessages();
}


function getActiveConversation() {

    return conversations.find(
        conversation =>
            conversation.id ===
            activeConversationId
    );
}


function deleteConversation(id) {

    conversations =
        conversations.filter(
            conversation =>
                conversation.id !== id
        );

    if (
        activeConversationId === id
    ) {

        if (
            conversations.length > 0
        ) {

            activeConversationId =
                conversations[0].id;

        } else {

            createConversation();

            return;
        }
    }

    saveConversations();

    renderConversations();
    renderMessages();
}


function renameConversation(id) {

    const conversation =
        conversations.find(
            c => c.id === id
        );

    if (!conversation) {
        return;
    }

    const name =
        prompt(
            "Nombre de la conversación:",
            conversation.title
        );

    if (
        name &&
        name.trim()
    ) {

        conversation.title =
            name.trim();

        saveConversations();

        renderConversations();
    }
}


/* =========================================================
   RENDER CONVERSACIONES
========================================================= */

function renderConversations() {

    conversationList.innerHTML = "";

    conversations.forEach(
        conversation => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "conversation" +
                (
                    conversation.id ===
                    activeConversationId
                        ? " active"
                        : ""
                );

            item.onclick =
                () => {

                    activeConversationId =
                        conversation.id;

                    renderConversations();
                    renderMessages();
                };

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "conversation-name";

            name.textContent =
                conversation.title;

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "conversation-actions";

            const rename =
                document.createElement(
                    "button"
                );

            rename.textContent =
                "✎";

            rename.title =
                "Renombrar";

            rename.onclick =
                event => {

                    event.stopPropagation();

                    renameConversation(
                        conversation.id
                    );
                };

            const remove =
                document.createElement(
                    "button"
                );

            remove.textContent =
                "×";

            remove.title =
                "Eliminar";

            remove.onclick =
                event => {

                    event.stopPropagation();

                    deleteConversation(
                        conversation.id
                    );
                };

            actions.appendChild(
                rename
            );

            actions.appendChild(
                remove
            );

            item.appendChild(
                name
            );

            item.appendChild(
                actions
            );

            conversationList.appendChild(
                item
            );
        }
    );
}


/* =========================================================
   RENDER MENSAJES
========================================================= */

function renderMessages() {

    messagesElement.innerHTML = "";

    const conversation =
        getActiveConversation();

    if (!conversation) {
        return;
    }

    if (
        conversation.messages.length === 0
    ) {

        const welcome =
            document.createElement(
                "div"
            );

        welcome.className =
            "welcome";

        welcome.innerHTML = `
            <h1>Alicia</h1>
            <p>
                Estoy acá. Hablame.
            </p>
        `;

        messagesElement.appendChild(
            welcome
        );

        return;
    }

    conversation.messages.forEach(
        message => {

            addMessageToDOM(
                message.role,
                message.content,
                false
            );
        }
    );

    scrollToBottom();
}


function addMessageToDOM(
    role,
    content,
    scroll = true
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );

    const inner =
        document.createElement(
            "div"
        );

    const label =
        document.createElement(
            "div"
        );

    label.className =
        "message-label";

    label.textContent =
        role === "user"
            ? "Vos"
            : "Alicia";

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";

    bubble.textContent =
        content;

    inner.appendChild(
        label
    );

    inner.appendChild(
        bubble
    );

    wrapper.appendChild(
        inner
    );

    messagesElement.appendChild(
        wrapper
    );

    if (scroll) {
        scrollToBottom();
    }
}


/* =========================================================
   TYPING
========================================================= */

function showTyping() {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    wrapper.id =
        "typingMessage";

    wrapper.innerHTML = `
        <div>
            <div class="message-label">
                Alicia
            </div>

            <div class="message-bubble">

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        </div>
    `;

    messagesElement.appendChild(
        wrapper
    );

    scrollToBottom();
}


function hideTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {
        typing.remove();
    }
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    messagesElement.scrollTop =
        messagesElement.scrollHeight;
}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (
        !text &&
        !selectedFile &&
        !selectedImage
    ) {
        return;
    }

    const conversation =
        getActiveConversation();

    if (!conversation) {
        return;
    }

    const userContent =
        text ||
        (
            selectedFile
                ? `[Archivo: ${selectedFile.name}]`
                : "[Imagen]"
        );

    conversation.messages.push({
        role: "user",
        content: userContent
    });

    /*
     * Título automático.
     */

    if (
        conversation.title ===
        "Nueva conversación"
    ) {

        conversation.title =
            text
                ? text.substring(
                    0,
                    35
                )
                : "Nueva conversación";

        renderConversations();
    }

    saveConversations();

    renderMessages();

    const finalText =
        text ||
        "Analizá el archivo o imagen que te envié.";

    const imageToSend =
        selectedImage;

    /*
     * Guardamos la historia ANTERIOR.
     * El mensaje actual no se duplica.
     */

    const history =
        conversation.messages
            .slice(0, -1)
            .map(message => ({
                role:
                    message.role,

                content:
                    message.content
            }));

    messageInput.value = "";

    resetFile();

    messageInput.style.height =
        "42px";

    sendButton.disabled =
        true;

    headerStatus.textContent =
        "Pensando...";

    showTyping();

    try {

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                finalText,

                            image:
                                imageToSend,

                            history:
                                history
                        })
                }
            );

        const data =
            await response.json();

        hideTyping();

        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data?.error ||
                "Error desconocido."
            );
        }

        const answer =
            data.response ||
            "No recibí respuesta.";

        conversation.messages.push({
            role: "assistant",
            content: answer
        });

        saveConversations();

        addMessageToDOM(
            "assistant",
            answer
        );

        headerStatus.textContent =
            "En línea";

        /*
         * Como hubo una conversación nueva,
         * reiniciamos el momento desde el cual
         * Alicia puede volver a tener iniciativa.
         */

        aliciaLastInitiative =
            Date.now();

        scheduleNextAliciaCheck();

    }

    catch (error) {

        hideTyping();

        console.error(
            "ALICIA ERROR:",
            error
        );

        const errorMessage =
            "No pude conectarme con mi cerebro ahora mismo.\n\n" +
            "Detalle: " +
            error.message;

        addMessageToDOM(
            "assistant",
            errorMessage
        );

        headerStatus.textContent =
            "Error de conexión";
    }

    finally {

        sendButton.disabled =
            false;

        messageInput.focus();
    }
}


/* =========================================================
   INICIATIVA AUTÓNOMA
========================================================= */

async function checkAliciaInitiative() {

    if (
        aliciaInitiativeRunning
    ) {
        return;
    }

    const conversation =
        getActiveConversation();

    if (!conversation) {
        return;
    }

    /*
     * Alicia necesita tener algo de contexto.
     */

    if (
        !conversation.messages ||
        conversation.messages.length === 0
    ) {
        scheduleNextAliciaCheck();
        return;
    }

    /*
     * No permitir iniciativas
     * demasiado seguidas.
     */

    const now =
        Date.now();

    if (
        aliciaLastInitiative &&
        now -
            aliciaLastInitiative <
            5 * 60 * 1000
    ) {

        scheduleNextAliciaCheck();

        return;
    }

    aliciaInitiativeRunning =
        true;

    try {

        /*
         * Solamente enviamos las últimas
         * conversaciones para no desperdiciar
         * contexto.
         */

        const history =
            conversation.messages
                .slice(-30)
                .map(message => ({
                    role:
                        message.role,

                    content:
                        message.content
                }));

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initiative:
                                true,

                            history:
                                history
                        })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.ok
        ) {

            console.error(
                "Initiative error:",
                data?.error
            );

            return;
        }

        /*
         * Alicia decidió quedarse callada.
         */

        if (
            data.initiative !== true ||
            !data.response
        ) {

            return;
        }

        const message =
            data.response.trim();

        if (!message) {
            return;
        }

        /*
         * Evitar repetir un mensaje.
         */

        const alreadyExists =
            conversation.messages.some(
                item =>
                    item.role ===
                        "assistant" &&
                    item.content.trim() ===
                        message
            );

        if (alreadyExists) {
            return;
        }

        /*
         * Mostrar que Alicia está escribiendo.
         */

        showTyping();

        headerStatus.textContent =
            "Alicia está escribiendo...";

        /*
         * Pequeño retraso natural.
         */

        const typingDelay =
            Math.min(
                3500,
                Math.max(
                    700,
                    message.length * 18
                )
            );

        await sleep(
            typingDelay
        );

        hideTyping();

        /*
         * Agregar mensaje.
         */

        conversation.messages.push({
            role: "assistant",
            content: message
        });

        saveConversations();

        addMessageToDOM(
            "assistant",
            message
        );

        headerStatus.textContent =
            "En línea";

        aliciaLastInitiative =
            Date.now();

    }

    catch (error) {

        console.error(
            "Alicia initiative error:",
            error
        );

    }

    finally {

        aliciaInitiativeRunning =
            false;

        scheduleNextAliciaCheck();
    }
}


/* =========================================================
   TEMPORIZADOR AUTÓNOMO
========================================================= */

function scheduleNextAliciaCheck() {

    if (
        aliciaInitiativeTimer
    ) {

        clearTimeout(
            aliciaInitiativeTimer
        );
    }

    /*
     * Tiempo aleatorio entre
     * 1 y 4 minutos.
     */

    const minimum =
        60 * 1000;

    const maximum =
        4 * 60 * 1000;

    const delay =
        Math.floor(
            minimum +
            Math.random() *
                (
                    maximum -
                    minimum
                )
        );

    aliciaInitiativeTimer =
        setTimeout(
            async () => {

                await checkAliciaInitiative();

            },
            delay
        );
}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   ARCHIVOS
========================================================= */

fileButton.onclick =
    () => {

        fileInput.click();

    };


fileInput.onchange =
    async () => {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }

        selectedFile =
            file;

        fileName.textContent =
            file.name;

        filePreview.classList.add(
            "visible"
        );

        /*
         * Imagen
         */

        if (
            file.type.startsWith(
                "image/"
            )
        ) {

            selectedImage =
                await readFileAsDataURL(
                    file
                );

            return;
        }

        /*
         * Para archivos de texto
         */

        try {

            const text =
                await readTextFile(
                    file
                );

            if (text) {

                messageInput.value =
                    `Analizá este archivo:\n\n${text.substring(
                        0,
                        30000
                    )}`;

                messageInput.dispatchEvent(
                    new Event(
                        "input"
                    )
                );
            }

        }

        catch (error) {

            console.error(
                "Error leyendo archivo:",
                error
            );
        }
    };


removeFile.onclick =
    () => {

        resetFile();

    };


function resetFile() {

    selectedFile =
        null;

    selectedImage =
        null;

    fileInput.value =
        "";

    filePreview.classList.remove(
        "visible"
    );
}


/* =========================================================
   LECTURA DE ARCHIVOS
========================================================= */

function readFileAsDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


function readTextFile(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                reject;

            reader.readAsText(
                file
            );
        }
    );
}


/* =========================================================
   INPUT
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "42px";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                160
            ) + "px";
    }
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


sendButton.onclick =
    sendMessage;


/* =========================================================
   NUEVA CONVERSACIÓN
========================================================= */

newChatButton.onclick =
    () => {

        createConversation();

        messageInput.focus();

    };


/* =========================================================
   INICIAR
========================================================= */

loadConversations();

/*
 * Alicia queda habilitada para iniciar
 * conversaciones por sí misma.
 */

scheduleNextAliciaCheck();

</script>
