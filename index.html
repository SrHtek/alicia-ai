<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #292929;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status {
            width: 12px;
            height: 12px;
            background: #35d06f;
            border-radius: 50%;
            box-shadow: 0 0 10px #35d06f;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .alicia {
            background: #202020;
            align-self: flex-start;
        }

        .user {
            background: #333;
            align-self: flex-end;
        }

        .typing {
            opacity: 0.6;
            font-style: italic;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #292929;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #191919;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="status"></div>
        <h1>Alicia</h1>
    </div>

    <div class="chat" id="chat">

        <div class="message alicia">
            Hola. Soy Alicia. 👋
        </div>

    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Escribile a Alicia..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Enviar
        </button>

    </div>

</div>

<script>

    // ==========================================
    // CONFIGURACIÓN
    // ==========================================

    const ALICIA_API =
        "https://alica-ai.hector-s-g-rivero.workers.dev/";


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const input =
        document.getElementById("messageInput");

    const chat =
        document.getElementById("chat");

    const sendButton =
        document.getElementById("sendButton");


    // ==========================================
    // AGREGAR MENSAJE AL CHAT
    // ==========================================

    function addMessage(text, type) {

        const message =
            document.createElement("div");

        message.classList.add(
            "message",
            type
        );

        message.textContent = text;

        chat.appendChild(message);

        chat.scrollTop =
            chat.scrollHeight;

        return message;
    }


    // ==========================================
    // INDICADOR DE ALICIA PENSANDO
    // ==========================================

    function showTyping() {

        const typing =
            document.createElement("div");

        typing.classList.add(
            "message",
            "alicia",
            "typing"
        );

        typing.id = "typing";

        typing.textContent =
            "Alicia está pensando...";

        chat.appendChild(typing);

        chat.scrollTop =
            chat.scrollHeight;
    }


    function removeTyping() {

        const typing =
            document.getElementById("typing");

        if (typing) {
            typing.remove();
        }
    }


    // ==========================================
    // HABLAR CON ALICIA
    // ==========================================

    async function askAlicia(text) {

        try {

            const response =
                await fetch(
                    ALICIA_API,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    }
                );


            const data =
                await response.json();


            removeTyping();


            if (!response.ok) {

                console.error(
                    "Error del servidor:",
                    data
                );

                addMessage(
                    "Tuve un problema conectándome con mi cerebro.",
                    "alicia"
                );

                return;
            }


            if (data.reply) {

                addMessage(
                    data.reply,
                    "alicia"
                );

            } else {

                addMessage(
                    "No recibí una respuesta del cerebro.",
                    "alicia"
                );

            }


        } catch (error) {

            console.error(
                "Error:",
                error
            );

            removeTyping();

            addMessage(
                "No puedo conectarme con mi cerebro ahora mismo.",
                "alicia"
            );

        } finally {

            sendButton.disabled = false;
            input.disabled = false;

            input.focus();

        }

    }


    // ==========================================
    // ENVIAR MENSAJE
    // ==========================================

    function sendMessage() {

        const text =
            input.value.trim();


        if (text === "") {
            return;
        }


        // Mostrar mensaje del usuario

        addMessage(
            text,
            "user"
        );


        // Limpiar campo

        input.value = "";


        // Bloquear mientras Alicia responde

        sendButton.disabled = true;
        input.disabled = true;


        // Mostrar "pensando..."

        showTyping();


        // Mandar mensaje al cerebro

        askAlicia(text);

    }


    // ==========================================
    // ENTER PARA ENVIAR
    // ==========================================

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !sendButton.disabled
            ) {

                sendMessage();

            }

        }
    );


    // ==========================================
    // ENFOCAR EL CHAT AL ABRIR
    // ==========================================

    window.addEventListener(
        "load",
        function() {

            input.focus();

        }
    );

</script>

</body>
</html>
