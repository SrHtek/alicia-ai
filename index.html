<script>


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


const STORAGE_KEY =
    "alicia_conversations_v4";


const INITIATIVE_MIN_DELAY =
    15 * 60 * 1000;


const INITIATIVE_MAX_DELAY =
    30 * 60 * 1000;


const MIN_USER_IDLE =
    5 * 60 * 1000;



/* =====================================================
   ESTADO
   ===================================================== */

let conversations = {};

let activeConversationId = null;

let selectedImage = null;

let selectedFile = null;

let selectedFileText = null;

let initiativeTimer = null;

let initiativeChecking = false;

let recognition = null;

let isListening = false;



/* =====================================================
   ID
   ===================================================== */

function generateId() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 9)
    );

}



/* =====================================================
   GUARDAR
   ===================================================== */

function saveAll() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                conversations:
                    conversations,

                activeConversationId:
                    activeConversationId

            })

        );

    }

    catch(error) {

        console.error(
            "No se pudieron guardar las conversaciones:",
            error
        );

    }

}



/* =====================================================
   CARGAR
   ===================================================== */

function loadAll() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            createConversation(
                false
            );

            return;

        }


        const data =
            JSON.parse(saved);


        if (
            data &&
            data.conversations
        ) {

            conversations =
                data.conversations;

        }


        if (
            !conversations ||
            typeof conversations !== "object" ||
            Object.keys(conversations).length === 0
        ) {

            conversations = {};

            createConversation(
                false
            );

            return;

        }


        activeConversationId =
            data.activeConversationId;


        if (
            !activeConversationId ||
            !conversations[
                activeConversationId
            ]
        ) {

            activeConversationId =
                Object.keys(
                    conversations
                )[0];

        }

    }

    catch(error) {

        console.error(
            "Error cargando conversaciones:",
            error
        );


        conversations = {};

        createConversation(
            false
        );

    }

}



/* =====================================================
   CONVERSACIÓN ACTIVA
   ===================================================== */

function getActiveConversation() {

    if (
        !activeConversationId
    ) {

        return null;

    }


    return conversations[
        activeConversationId
    ] || null;

}



/* =====================================================
   NUEVA CONVERSACIÓN
   ===================================================== */

function createConversation(
    shouldSave = true
) {

    const id =
        generateId();


    conversations[id] = {

        id:
            id,

        title:
            "Nueva conversación",

        createdAt:
            Date.now(),

        updatedAt:
            Date.now(),

        lastUserActivity:
            Date.now(),

        messages:
            []

    };


    activeConversationId =
        id;


    if (shouldSave) {

        saveAll();

    }


    renderConversationList();

    renderMessages();

    scheduleInitiative();

}



/* =====================================================
   CAMBIAR CONVERSACIÓN
   ===================================================== */

function switchConversation(
    id
) {

    if (
        !conversations[id]
    ) {

        return;

    }


    activeConversationId =
        id;


    saveAll();

    renderConversationList();

    renderMessages();

    scheduleInitiative();

}



/* =====================================================
   ELIMINAR
   ===================================================== */

function deleteConversation(
    event,
    id
) {

    event.stopPropagation();


    const conversation =
        conversations[id];


    if (!conversation) {

        return;

    }


    const confirmed =
        confirm(
            `¿Eliminar "${conversation.title}"?`
        );


    if (!confirmed) {

        return;

    }


    delete conversations[id];


    const remaining =
        Object.keys(
            conversations
        );


    if (
        remaining.length === 0
    ) {

        createConversation(
            false
        );

    }

    else if (
        activeConversationId === id
    ) {

        activeConversationId =
            remaining[0];

    }


    saveAll();

    renderConversationList();

    renderMessages();

    scheduleInitiative();

}



/* =====================================================
   RENOMBRAR
   ===================================================== */

function renameConversation(
    id
) {

    const conversation =
        conversations[id];


    if (!conversation) {

        return;

    }


    const newName =
        prompt(
            "Nombre de la conversación:",
            conversation.title
        );


    if (
        newName === null
    ) {

        return;

    }


    const clean =
        newName.trim();


    if (!clean) {

        return;

    }


    conversation.title =
        clean.slice(
            0,
            60
        );


    conversation.updatedAt =
        Date.now();


    saveAll();

    renderConversationList();

}



/* =====================================================
   AUTO NOMBRE
   ===================================================== */

function generateConversationTitle(
    text
) {

    const clean =
        text
            .replace(/\s+/g, " ")
            .trim();


    if (!clean) {

        return "Nueva conversación";

    }


    return clean.slice(
        0,
        42
    ) +
    (
        clean.length > 42
            ? "..."
            : ""
    );

}



/* =====================================================
   LISTA
   ===================================================== */

function renderConversationList() {

    const list =
        document.getElementById(
            "conversationList"
        );


    list.innerHTML =
        "";


    const items =
        Object.values(
            conversations
        )
        .sort(
            (a, b) =>
                b.updatedAt -
                a.updatedAt
        );


    for (
        const conversation of items
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "conversation" +
            (
                conversation.id ===
                activeConversationId
                    ? " active"
                    : ""
            );


        element.onclick =
            () => {

                switchConversation(
                    conversation.id
                );

            };


        element.ondblclick =
            () => {

                renameConversation(
                    conversation.id
                );

            };


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "conversation-name";


        name.textContent =
            conversation.title;


        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "conversation-delete";


        deleteButton.textContent =
            "×";


        deleteButton.title =
            "Eliminar conversación";


        deleteButton.onclick =
            event => {

                deleteConversation(
                    event,
                    conversation.id
                );

            };


        element.appendChild(
            name
        );


        element.appendChild(
            deleteButton
        );


        list.appendChild(
            element
        );

    }

}



/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* =====================================================
   RENDER MENSAJES
   ===================================================== */

function renderMessages() {

    const chat =
        document.getElementById(
            "chat"
        );


    const conversation =
        getActiveConversation();


    chat.innerHTML =
        "";


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        chat.innerHTML = `

            <div class="welcome">

                <h1>Alicia</h1>

                <p>
                    Hola. Estoy acá.
                    ¿Qué hacemos?
                </p>

                <div class="suggestions">

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Contame algo interesante')"
                    >
                        Contame algo interesante
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('¿Qué podés hacer?')"
                    >
                        ¿Qué podés hacer?
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Contame algo que te dé curiosidad')"
                    >
                        Contame algo que te dé curiosidad
                    </div>

                </div>

            </div>

        `;


        return;

    }


    for (
        const message of conversation.messages
    ) {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message " +
            message.role;


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "message-content";


        content.innerHTML =
            escapeHTML(
                message.content
            );


        wrapper.appendChild(
            content
        );


        chat.appendChild(
            wrapper
        );

    }


    chat.scrollTop =
        chat.scrollHeight;

}



/* =====================================================
   AGREGAR MENSAJE
   ===================================================== */

function addMessage(
    role,
    content
) {

    const conversation =
        getActiveConversation();


    if (
        !conversation
    ) {

        return;

    }


    if (
        !content ||
        !content.trim()
    ) {

        return;

    }


    conversation.messages.push({

        role:
            role,

        content:
            content,

        timestamp:
            Date.now()

    });


    conversation.updatedAt =
        Date.now();


    if (
        role === "user"
    ) {

        conversation.lastUserActivity =
            Date.now();

    }


    if (
        role === "user" &&
        conversation.messages.filter(
            m => m.role === "user"
        ).length === 1 &&
        conversation.title ===
            "Nueva conversación"
    ) {

        conversation.title =
            generateConversationTitle(
                content
            );

    }


    saveAll();

    renderConversationList();

    renderMessages();

}



/* =====================================================
   ENVIAR
   ===================================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage &&
        !selectedFileText
    ) {

        return;

    }


    const imageToSend =
        selectedImage;


    let finalText =
        text;


    /*
        Si existe un archivo de texto,
        lo incorporamos al mensaje.

        De esta manera el Worker actual
        puede seguir funcionando sin
        necesitar cambios.
    */

    if (
        selectedFileText
    ) {

        const fileName =
            selectedFile
                ? selectedFile.name
                : "archivo";


        finalText +=
            (
                finalText
                    ? "\n\n"
                    : ""
            ) +
            `\n[ARCHIVO ADJUNTO: ${fileName}]\n` +
            selectedFileText +
            `\n[FIN DEL ARCHIVO]`;

    }


    /*
        Para imágenes sin texto,
        mantenemos el comportamiento
        anterior.
    */

    const displayText =
        text ||
        (
            imageToSend
                ? "[Imagen enviada]"
                : `[Archivo: ${
                    selectedFile
                        ? selectedFile.name
                        : "archivo"
                  }]`
        );


    input.value =
        "";


    input.style.height =
        "auto";


    addMessage(
        "user",
        displayText
    );


    clearSelectedFile();


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message assistant";


    thinking.id =
        "thinking";


    thinking.innerHTML = `

        <div class="message-content">

            <div class="thinking">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    document
        .getElementById("chat")
        .appendChild(
            thinking
        );


    const chat =
        document.getElementById(
            "chat"
        );


    chat.scrollTop =
        chat.scrollHeight;


    try {

        const controller =
            new AbortController();


        const timeout =
            setTimeout(

                () => {

                    controller.abort();

                },

                90000

            );


        const response =
            await fetch(

                WORKER_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                finalText,

                            image:
                                imageToSend

                        }),

                    signal:
                        controller.signal

                }

            );


        clearTimeout(
            timeout
        );


        const data =
            await response.json();


        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (
            thinkingElement
        ) {

            thinkingElement.remove();

        }


        if (
            !response.ok
        ) {

            addMessage(

                "assistant",

                "No pude conectarme con mi cerebro ahora mismo.\n\n" +
                (
                    data.error ||
                    "Error desconocido."
                )

            );

            return;

        }


        if (
            data.reply &&
            typeof data.reply === "string"
        ) {

            addMessage(

                "assistant",

                data.reply

            );

        }

        else {

            addMessage(

                "assistant",

                "No recibí una respuesta."

            );

        }


        scheduleInitiative();

    }

    catch(error) {

        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (
            thinkingElement
        ) {

            thinkingElement.remove();

        }


        if (
            error.name ===
            "AbortError"
        ) {

            addMessage(

                "assistant",

                "La respuesta tardó demasiado y se canceló. Probá nuevamente."

            );

        }

        else {

            addMessage(

                "assistant",

                "No pude conectarme con mi cerebro ahora mismo.\n\n" +
                error.message

            );

        }

    }

}

/* =====================================================
   FORMATEAR TAMAÑO
   ===================================================== */

function formatFileSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes + " B";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) + " MB";

}



/* =====================================================
   TIPO DE ARCHIVO
   ===================================================== */

function getFileTypeLabel(
    file
) {

    const name =
        file.name.toLowerCase();


    if (
        name.endsWith(".pdf")
    ) {

        return "PDF";

    }


    if (
        name.endsWith(".doc") ||
        name.endsWith(".docx")
    ) {

        return "DOC";

    }


    if (
        name.endsWith(".txt")
    ) {

        return "TXT";

    }


    if (
        name.endsWith(".csv")
    ) {

        return "CSV";

    }


    if (
        name.endsWith(".json")
    ) {

        return "JSON";

    }


    if (
        name.endsWith(".md")
    ) {

        return "MD";

    }


    if (
        name.endsWith(".html")
    ) {

        return "HTML";

    }


    if (
        file.type.startsWith("image/")
    ) {

        return "IMG";

    }


    return "FILE";

}



/* =====================================================
   PROCESAR ARCHIVO
   ===================================================== */

document
    .getElementById("fileInput")
    .addEventListener(

        "change",

        async function(event) {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            /*
                Límite de 15 MB para
                documentos.
            */

            if (
                file.size >
                15 * 1024 * 1024
            ) {

                alert(
                    "El archivo es demasiado grande. Máximo 15 MB."
                );


                this.value =
                    "";


                return;

            }


            selectedFile =
                file;


            selectedFileText =
                null;


            const type =
                getFileTypeLabel(
                    file
                );


            document
                .getElementById(
                    "fileIcon"
                )
                .textContent =
                    type;


            document
                .getElementById(
                    "fileName"
                )
                .textContent =
                    file.name;


            document
                .getElementById(
                    "fileSize"
                )
                .textContent =
                    formatFileSize(
                        file.size
                    );


            document
                .getElementById(
                    "filePreview"
                )
                .style.display =
                    "flex";


            /*
                Si es imagen,
                usamos la imagen directamente
                como antes.
            */

            if (
                file.type.startsWith(
                    "image/"
                )
            ) {

                if (
                    file.size >
                    6 * 1024 * 1024
                ) {

                    alert(
                        "La imagen es demasiado grande. Máximo 6 MB."
                    );


                    clearSelectedFile();

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        selectedImage =
                            e.target.result;


                        document
                            .getElementById(
                                "previewImage"
                            )
                            .src =
                                selectedImage;


                        document
                            .getElementById(
                                "imagePreview"
                            )
                            .style.display =
                                "block";

                    };


                reader.readAsDataURL(
                    file
                );


                return;

            }


            /*
                Documentos.
            */

            try {

                selectedFileText =
                    await extractFileText(
                        file
                    );


                if (
                    !selectedFileText ||
                    !selectedFileText.trim()
                ) {

                    throw new Error(
                        "No se pudo extraer texto de este archivo."
                    );

                }


                document
                    .getElementById(
                        "fileSize"
                    )
                    .textContent =
                        formatFileSize(
                            file.size
                        ) +
                        " • texto listo";

            }

            catch(error) {

                console.error(
                    "Error procesando archivo:",
                    error
                );


                selectedFileText =
                    `[No se pudo extraer automáticamente el texto de "${file.name}".]`;


                document
                    .getElementById(
                        "fileSize"
                    )
                    .textContent =
                        formatFileSize(
                            file.size
                        ) +
                        " • adjunto";

            }

        }

    );



/* =====================================================
   EXTRAER TEXTO
   ===================================================== */

async function extractFileText(
    file
) {

    const name =
        file.name.toLowerCase();


    /*
        TXT / CSV / JSON / MD / HTML
    */

    if (
        name.endsWith(".txt") ||
        name.endsWith(".csv") ||
        name.endsWith(".json") ||
        name.endsWith(".md") ||
        name.endsWith(".html")
    ) {

        return await file.text();

    }


    /*
        DOCX
    */

    if (
        name.endsWith(".docx")
    ) {

        if (
            typeof mammoth ===
            "undefined"
        ) {

            throw new Error(
                "Mammoth no está disponible."
            );

        }


        const arrayBuffer =
            await file.arrayBuffer();


        const result =
            await mammoth.extractRawText({
                arrayBuffer:
                    arrayBuffer
            });


        return result.value || "";

    }


    /*
        PDF
    */

    if (
        name.endsWith(".pdf")
    ) {

        return await extractPDFText(
            file
        );

    }


    /*
        DOC antiguo.
        Los .doc binarios no se pueden
        interpretar de forma segura
        directamente desde el navegador.
    */

    if (
        name.endsWith(".doc")
    ) {

        return (
            "[El formato .doc antiguo no puede ser leído directamente por el navegador. Convertí el archivo a .docx o .pdf.]"
        );

    }


    throw new Error(
        "Tipo de archivo no compatible."
    );

}



/* =====================================================
   PDF → TEXTO
   ===================================================== */

async function extractPDFText(
    file
) {

    if (
        typeof pdfjsLib ===
        "undefined"
    ) {

        /*
            Esperamos brevemente a que
            PDF.js termine de cargar.
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1000
                )
        );

    }


    if (
        typeof pdfjsLib ===
        "undefined"
    ) {

        throw new Error(
            "PDF.js no está disponible."
        );

    }


    const arrayBuffer =
        await file.arrayBuffer();


    const loadingTask =
        pdfjsLib.getDocument({
            data:
                arrayBuffer
        });


    const pdf =
        await loadingTask.promise;


    let fullText =
        "";


    /*
        Límite preventivo para evitar
        mandar documentos gigantes
        al modelo.
    */

    const maxCharacters =
        80000;


    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {

        const page =
            await pdf.getPage(
                pageNumber
            );


        const textContent =
            await page.getTextContent();


        const pageText =
            textContent.items
                .map(
                    item =>
                        item.str
                )
                .join(" ");


        fullText +=
            `\n\n--- Página ${pageNumber} ---\n\n` +
            pageText;


        if (
            fullText.length >=
            maxCharacters
        ) {

            fullText =
                fullText.substring(
                    0,
                    maxCharacters
                ) +
                "\n\n[DOCUMENTO RECORTADO POR LONGITUD]";

            break;

        }

    }


    return fullText.trim();

}

/* =====================================================
   RECONOCIMIENTO DE VOZ
   ===================================================== */

function setupSpeechRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (
        !SpeechRecognition
    ) {

        recognition =
            null;

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "es-AR";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening =
                true;


            const button =
                document.getElementById(
                    "micButton"
                );


            button.classList.add(
                "listening"
            );


            button.title =
                "Dejar de escuchar";

        };


    recognition.onresult =
        function(event) {

            const input =
                document.getElementById(
                    "messageInput"
                );


            /*
                Conservamos el texto que
                ya estaba escrito antes
                de empezar a hablar.
            */

            let finalTranscript =
                "";


            let interimTranscript =
                "";


            for (
                let i =
                    event.resultIndex;
                i <
                    event.results.length;
                i++
            ) {

                const result =
                    event.results[i];


                if (
                    result.isFinal
                ) {

                    finalTranscript +=
                        result[0].transcript;

                }

                else {

                    interimTranscript +=
                        result[0].transcript;

                }

            }


            /*
                Guardamos el texto base
                cuando empezamos a escuchar.
            */

            if (
                typeof recognition.baseText !==
                "string"
            ) {

                recognition.baseText =
                    input.value;

            }


            const base =
                recognition.baseText
                    ? recognition.baseText.trimEnd() +
                      " "
                    : "";


            input.value =
                (
                    base +
                    finalTranscript +
                    interimTranscript
                ).trim();


            input.style.height =
                "auto";


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    140
                ) + "px";

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Reconocimiento de voz:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                alert(
                    "El navegador bloqueó el micrófono. Permití el acceso al micrófono para usar esta función."
                );

            }

        };


    recognition.onend =
        function() {

            /*
                Si sigue activado,
                Chrome puede cortar una sesión
                larga. La reanudamos.
            */

            if (
                isListening
            ) {

                try {

                    recognition.start();

                }

                catch(error) {

                    console.log(
                        "No se pudo reanudar el micrófono:",
                        error
                    );

                }

            }

            else {

                const button =
                    document.getElementById(
                        "micButton"
                    );


                button.classList.remove(
                    "listening"
                );


                button.title =
                    "Hablar con Alicia";

            }

        };

}



function toggleSpeechRecognition() {

    if (!recognition) {

        alert(
            "Tu navegador no soporta reconocimiento de voz. Probá con Google Chrome o Microsoft Edge."
        );

        return;

    }


    if (
        isListening
    ) {

        stopSpeechRecognition();

    }

    else {

        const input =
            document.getElementById(
                "messageInput"
            );


        recognition.baseText =
            input.value;


        try {

            recognition.start();

        }

        catch(error) {

            console.log(
                "No se pudo iniciar el micrófono:",
                error
            );

        }

    }

}



function stopSpeechRecognition() {

    isListening =
        false;


    if (
        recognition
    ) {

        try {

            recognition.stop();

        }

        catch(error) {

            console.log(
                error
            );

        }

    }


    const button =
        document.getElementById(
            "micButton"
        );


    button.classList.remove(
        "listening"
    );


    button.title =
        "Hablar con Alicia";

}

/* =====================================================
   INICIATIVA
   ===================================================== */

function randomInitiativeDelay() {

    return Math.floor(

        Math.random() *
        (
            INITIATIVE_MAX_DELAY -
            INITIATIVE_MIN_DELAY
        )

    ) +
    INITIATIVE_MIN_DELAY;

}



function scheduleInitiative() {

    if (
        initiativeTimer
    ) {

        clearTimeout(
            initiativeTimer
        );

    }


    const conversation =
        getActiveConversation();


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        return;

    }


    initiativeTimer =
        setTimeout(

            checkInitiative,

            randomInitiativeDelay()

        );

}



async function checkInitiative() {

    if (
        initiativeChecking
    ) {

        scheduleInitiative();

        return;

    }


    const conversation =
        getActiveConversation();


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        scheduleInitiative();

        return;

    }


    const idleTime =
        Date.now() -
        conversation.lastUserActivity;


    if (
        idleTime <
        MIN_USER_IDLE
    ) {

        scheduleInitiative();

        return;

    }


    initiativeChecking =
        true;


    try {

        const recent =
            conversation.messages
                .slice(-14)
                .map(
                    message => ({

                        role:
                            message.role,

                        content:
                            message.content

                    })
                );


        const controller =
            new AbortController();


        const timeout =
            setTimeout(

                () => {

                    controller.abort();

                },

                45000

            );


        const response =
            await fetch(

                WORKER_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            initiative:
                                true,

                            conversation:
                                recent

                        }),

                    signal:
                        controller.signal

                }

            );


        clearTimeout(
            timeout
        );


        const data =
            await response.json();


        if (
            response.ok &&
            data.initiative === true &&
            typeof data.reply === "string" &&
            data.reply.trim()
        ) {

            if (
                conversation.id ===
                activeConversationId
            ) {

                addMessage(

                    "assistant",

                    data.reply.trim()

                );

            }

        }

    }

    catch(error) {

        console.log(
            "Iniciativa de Alicia:",
            error
        );

    }

    finally {

        initiativeChecking =
            false;


        scheduleInitiative();

    }

}

document.addEventListener(

    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            scheduleInitiative();

        }

    }

);
