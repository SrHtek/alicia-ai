<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Alicia AI</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    background: #05070a;

    color: #eafcff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    height: 100vh;

    overflow: hidden;

}


.app {

    width: 100%;

    height: 100vh;

    display: flex;

}


/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar {

    width: 260px;

    background: #080d12;

    border-right:
        1px solid
        rgba(0, 220, 255, 0.15);

    display: flex;

    flex-direction: column;

}


.logo {

    padding:
        25px 25px 15px;

    font-size: 25px;

    font-weight: bold;

    color: #63eaff;

}


.new-chat {

    margin:
        0 15px 15px;

    padding:
        11px 13px;

    border-radius: 10px;

    border:
        1px solid
        rgba(0, 220, 255, .18);

    background:
        rgba(0, 220, 255, .04);

    color:
        #bdeff7;

    text-align:
        left;

    cursor:
        pointer;

    transition:
        .2s;

}


.new-chat:hover {

    border-color:
        rgba(0, 220, 255, .5);

    background:
        rgba(0, 220, 255, .08);

    color:
        #63eaff;

}


.conversations {

    flex: 1;

    overflow-y: auto;

    padding:
        0 10px 10px;

}


.conversation {

    display: flex;

    align-items: center;

    gap: 6px;

    padding:
        10px 9px;

    margin-bottom:
        4px;

    border-radius:
        9px;

    cursor:
        pointer;

    color:
        #94a7af;

    transition:
        .2s;

}


.conversation:hover {

    background:
        rgba(0, 220, 255, .06);

    color:
        #d9faff;

}


.conversation.active {

    background:
        rgba(0, 220, 255, .10);

    color:
        #63eaff;

}


.conversation-name {

    flex: 1;

    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size:
        13px;

}


.conversation-delete {

    opacity:
        0;

    width:
        24px;

    height:
        24px;

    border-radius:
        6px;

    background:
        transparent;

    color:
        #7d8b94;

    cursor:
        pointer;

}


.conversation:hover
.conversation-delete {

    opacity:
        1;

}


.conversation-delete:hover {

    color:
        #ff6f7d;

    background:
        rgba(255, 80, 100, .08);

}


.sidebar-info {

    padding:
        15px 25px 25px;

    color:
        #7d8b94;

    font-size:
        12px;

    line-height:
        1.6;

    border-top:
        1px solid
        rgba(0, 220, 255, .08);

}


/* =====================================================
   MAIN
   ===================================================== */

.main {

    flex: 1;

    display: flex;

    flex-direction: column;

    min-width: 0;

}


/* HEADER */

.header {

    height:
        70px;

    display:
        flex;

    align-items:
        center;

    padding:
        0 25px;

    border-bottom:
        1px solid
        rgba(0, 220, 255, 0.12);

    background:
        #070a0e;

}


.status {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    color:
        #b9c9d0;

}


.status-dot {

    width:
        9px;

    height:
        9px;

    border-radius:
        50%;

    background:
        #4de7ff;

    box-shadow:
        0 0 12px
        rgba(77, 231, 255, .8);

}


/* =====================================================
   CHAT
   ===================================================== */

.chat {

    flex:
        1;

    overflow-y:
        auto;

    padding:
        35px 8%;

}


.message {

    display:
        flex;

    margin-bottom:
        25px;

}


.message.user {

    justify-content:
        flex-end;

}


.message-content {

    max-width:
        750px;

    padding:
        15px 18px;

    border-radius:
        15px;

    line-height:
        1.55;

    white-space:
        pre-wrap;

}


.message.assistant
.message-content {

    background:
        #0b1117;

    border:
        1px solid
        rgba(0, 220, 255, .12);

}


.message.user
.message-content {

    background:
        #123541;

    border:
        1px solid
        rgba(0, 220, 255, .2);

}


/* =====================================================
   WELCOME
   ===================================================== */

.welcome {

    text-align:
        center;

    max-width:
        650px;

    margin:
        10vh auto 40px;

}


.welcome h1 {

    font-size:
        48px;

    color:
        #63eaff;

    margin-bottom:
        15px;

}


.welcome p {

    color:
        #83949d;

    line-height:
        1.6;

}


/* =====================================================
   SUGGESTIONS
   ===================================================== */

.suggestions {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        10px;

    justify-content:
        center;

    margin-top:
        30px;

}


.suggestion {

    background:
        #0b1117;

    border:
        1px solid
        rgba(0, 220, 255, .15);

    color:
        #b7c8cf;

    padding:
        10px 15px;

    border-radius:
        10px;

    cursor:
        pointer;

    transition:
        .2s;

}


.suggestion:hover {

    border-color:
        rgba(0, 220, 255, .5);

    color:
        #63eaff;

}


/* =====================================================
   THINKING
   ===================================================== */

.thinking {

    display:
        flex;

    gap:
        5px;

    padding:
        10px;

}


.thinking span {

    width:
        7px;

    height:
        7px;

    background:
        #63eaff;

    border-radius:
        50%;

    animation:
        thinking 1.2s infinite;

}


.thinking span:nth-child(2) {

    animation-delay:
        .15s;

}


.thinking span:nth-child(3) {

    animation-delay:
        .3s;

}


@keyframes thinking {

    0%, 100% {

        opacity:
            .25;

        transform:
            translateY(0);

    }

    50% {

        opacity:
            1;

        transform:
            translateY(-4px);

    }

}


/* =====================================================
   INPUT
   ===================================================== */

.input-area {

    padding:
        20px 8%;

    border-top:
        1px solid
        rgba(0, 220, 255, .12);

    background:
        #070a0e;

}


.input-wrapper {

    display:
        flex;

    align-items:
        flex-end;

    gap:
        10px;

    background:
        #0b1117;

    border:
        1px solid
        rgba(0, 220, 255, .2);

    border-radius:
        15px;

    padding:
        10px;

}


textarea {

    flex:
        1;

    resize:
        none;

    background:
        transparent;

    border:
        none;

    outline:
        none;

    color:
        white;

    font-size:
        15px;

    min-height:
        24px;

    max-height:
        140px;

}


button {

    border:
        none;

    cursor:
        pointer;

}


.send {

    width:
        42px;

    height:
        42px;

    border-radius:
        10px;

    background:
        #63eaff;

    color:
        #031014;

    font-weight:
        bold;

}


.send:hover {

    filter:
        brightness(1.1);

}


.image-button {

    width:
        42px;

    height:
        42px;

    border-radius:
        10px;

    background:
        transparent;

    color:
        #63eaff;

    font-size:
        20px;

}


.image-preview {

    display:
        none;

    margin-bottom:
        10px;

}


.image-preview img {

    max-width:
        180px;

    max-height:
        120px;

    border-radius:
        10px;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width: 700px) {

    .sidebar {

        width:
            220px;

    }

    .chat {

        padding:
            25px 15px;

    }

    .input-area {

        padding:
            12px;

    }

    .welcome h1 {

        font-size:
            38px;

    }

}


@media(max-width: 520px) {

    .sidebar {

        width:
            190px;

    }

    .sidebar-info {

        display:
            none;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         SIDEBAR
         ================================================= -->

    <aside class="sidebar">


        <div class="logo">

            ALICIA

        </div>


        <button
            class="new-chat"
            onclick="createConversation()"
        >

            + Nueva conversación

        </button>


        <div
            class="conversations"
            id="conversationList"
        ></div>


        <div class="sidebar-info">

            Inteligencia artificial
            conversacional.

            <br><br>

            Alicia puede conversar,
            analizar imágenes y
            tomar iniciativa.

            <br><br>

            Doble click en una
            conversación para
            cambiarle el nombre.

        </div>


    </aside>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main class="main">


        <header class="header">

            <div class="status">

                <span class="status-dot"></span>

                Alicia está conectada

            </div>

        </header>


        <section
            class="chat"
            id="chat"
        ></section>


        <div class="input-area">


            <div
                class="image-preview"
                id="imagePreview"
            >

                <img
                    id="previewImage"
                >

            </div>


            <div class="input-wrapper">


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >


                <button
                    class="image-button"
                    onclick="
                        document
                        .getElementById('imageInput')
                        .click()
                    "
                >

                    +

                </button>


                <textarea
                    id="messageInput"
                    placeholder="Escribile a Alicia..."
                    rows="1"
                ></textarea>


                <button
                    class="send"
                    onclick="sendMessage()"
                >

                    ↑

                </button>


            </div>

        </div>


    </main>


</div>



<script>


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


const STORAGE_KEY =
    "alicia_conversations_v4";


/*
    Alicia NO consulta al servidor cada pocos minutos.

    Primero espera bastante tiempo desde la última
    actividad del usuario.

    Esto evita gastar innecesariamente el límite
    gratuito de OpenRouter.
*/

const INITIATIVE_MIN_DELAY =
    15 * 60 * 1000;


const INITIATIVE_MAX_DELAY =
    30 * 60 * 1000;


const MIN_USER_IDLE =
    5 * 60 * 1000;


let conversations = {};

let activeConversationId = null;

let selectedImage = null;

let initiativeTimer = null;

let initiativeChecking = false;



/* =====================================================
   ID
   ===================================================== */

function generateId() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 9)
    );

}



/* =====================================================
   GUARDAR TODO
   ===================================================== */

function saveAll() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                conversations:
                    conversations,

                activeConversationId:
                    activeConversationId

            })

        );

    }

    catch(error) {

        console.error(
            "No se pudieron guardar las conversaciones:",
            error
        );

    }

}



/* =====================================================
   CARGAR TODO
   ===================================================== */

function loadAll() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            createConversation(
                false
            );

            return;

        }


        const data =
            JSON.parse(saved);


        if (
            data &&
            data.conversations
        ) {

            conversations =
                data.conversations;

        }


        if (
            !conversations ||
            typeof conversations !== "object" ||
            Object.keys(conversations).length === 0
        ) {

            conversations = {};

            createConversation(
                false
            );

            return;

        }


        activeConversationId =
            data.activeConversationId;


        if (
            !activeConversationId ||
            !conversations[
                activeConversationId
            ]
        ) {

            activeConversationId =
                Object.keys(
                    conversations
                )[0];

        }

    }

    catch(error) {

        console.error(
            "Error cargando conversaciones:",
            error
        );


        conversations = {};

        createConversation(
            false
        );

    }

}



/* =====================================================
   CONVERSACIÓN ACTIVA
   ===================================================== */

function getActiveConversation() {

    if (
        !activeConversationId
    ) {

        return null;

    }


    return conversations[
        activeConversationId
    ] || null;

}



/* =====================================================
   NUEVA CONVERSACIÓN
   ===================================================== */

function createConversation(
    shouldSave = true
) {

    const id =
        generateId();


    conversations[id] = {

        id:
            id,

        title:
            "Nueva conversación",

        createdAt:
            Date.now(),

        updatedAt:
            Date.now(),

        lastUserActivity:
            Date.now(),

        messages:
            []

    };


    activeConversationId =
        id;


    if (shouldSave) {

        saveAll();

    }


    renderConversationList();

    renderMessages();

    scheduleInitiative();

}



/* =====================================================
   CAMBIAR CONVERSACIÓN
   ===================================================== */

function switchConversation(
    id
) {

    if (
        !conversations[id]
    ) {

        return;

    }


    activeConversationId =
        id;


    saveAll();

    renderConversationList();

    renderMessages();

    scheduleInitiative();

}



/* =====================================================
   ELIMINAR CONVERSACIÓN
   ===================================================== */

function deleteConversation(
    event,
    id
) {

    event.stopPropagation();


    const conversation =
        conversations[id];


    if (!conversation) {

        return;

    }


    const confirmed =
        confirm(
            `¿Eliminar "${conversation.title}"?`
        );


    if (!confirmed) {

        return;

    }


    delete conversations[id];


    const remaining =
        Object.keys(
            conversations
        );


    if (
        remaining.length === 0
    ) {

        createConversation(
            false
        );

    }

    else if (
        activeConversationId === id
    ) {

        activeConversationId =
            remaining[0];

    }


    saveAll();

    renderConversationList();

    renderMessages();

    scheduleInitiative();

}



/* =====================================================
   RENOMBRAR
   ===================================================== */

function renameConversation(
    id
) {

    const conversation =
        conversations[id];


    if (!conversation) {

        return;

    }


    const newName =
        prompt(
            "Nombre de la conversación:",
            conversation.title
        );


    if (
        newName === null
    ) {

        return;

    }


    const clean =
        newName.trim();


    if (!clean) {

        return;

    }


    conversation.title =
        clean.slice(
            0,
            60
        );


    conversation.updatedAt =
        Date.now();


    saveAll();

    renderConversationList();

}



/* =====================================================
   AUTO NOMBRE
   ===================================================== */

function generateConversationTitle(
    text
) {

    const clean =
        text
            .replace(/\s+/g, " ")
            .trim();


    if (!clean) {

        return "Nueva conversación";

    }


    return clean.slice(
        0,
        42
    ) +
    (
        clean.length > 42
            ? "..."
            : ""
    );

}



/* =====================================================
   LISTA
   ===================================================== */

function renderConversationList() {

    const list =
        document.getElementById(
            "conversationList"
        );


    list.innerHTML =
        "";


    const items =
        Object.values(
            conversations
        )
        .sort(
            (a, b) =>
                b.updatedAt -
                a.updatedAt
        );


    for (
        const conversation of items
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "conversation" +
            (
                conversation.id ===
                activeConversationId
                    ? " active"
                    : ""
            );


        element.onclick =
            () => {

                switchConversation(
                    conversation.id
                );

            };


        element.ondblclick =
            () => {

                renameConversation(
                    conversation.id
                );

            };


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "conversation-name";


        name.textContent =
            conversation.title;


        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "conversation-delete";


        deleteButton.textContent =
            "×";


        deleteButton.title =
            "Eliminar conversación";


        deleteButton.onclick =
            event => {

                deleteConversation(
                    event,
                    conversation.id
                );

            };


        element.appendChild(
            name
        );


        element.appendChild(
            deleteButton
        );


        list.appendChild(
            element
        );

    }

}



/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* =====================================================
   RENDER MENSAJES
   ===================================================== */

function renderMessages() {

    const chat =
        document.getElementById(
            "chat"
        );


    const conversation =
        getActiveConversation();


    chat.innerHTML =
        "";


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        chat.innerHTML = `

            <div class="welcome">

                <h1>Alicia</h1>

                <p>
                    Hola. Estoy acá.
                    ¿Qué hacemos?
                </p>

                <div class="suggestions">

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Contame algo interesante')"
                    >
                        Contame algo interesante
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('¿Qué podés hacer?')"
                    >
                        ¿Qué podés hacer?
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Contame algo que te dé curiosidad')"
                    >
                        Contame algo que te dé curiosidad
                    </div>

                </div>

            </div>

        `;


        return;

    }


    for (
        const message of conversation.messages
    ) {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message " +
            message.role;


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "message-content";


        content.innerHTML =
            escapeHTML(
                message.content
            );


        wrapper.appendChild(
            content
        );


        chat.appendChild(
            wrapper
        );

    }


    chat.scrollTop =
        chat.scrollHeight;

}



/* =====================================================
   AGREGAR MENSAJE
   ===================================================== */

function addMessage(
    role,
    content
) {

    const conversation =
        getActiveConversation();


    if (
        !conversation
    ) {

        return;

    }


    if (
        !content ||
        !content.trim()
    ) {

        return;

    }


    conversation.messages.push({

        role:
            role,

        content:
            content,

        timestamp:
            Date.now()

    });


    conversation.updatedAt =
        Date.now();


    if (
        role === "user"
    ) {

        conversation.lastUserActivity =
            Date.now();

    }


    /*
        Si es el primer mensaje del usuario,
        usamos automáticamente una parte del
        mensaje como nombre.
    */

    if (
        role === "user" &&
        conversation.messages.filter(
            m => m.role === "user"
        ).length === 1 &&
        conversation.title ===
            "Nueva conversación"
    ) {

        conversation.title =
            generateConversationTitle(
                content
            );

    }


    saveAll();

    renderConversationList();

    renderMessages();

}



/* =====================================================
   ENVIAR MENSAJE
   ===================================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    const imageToSend =
        selectedImage;


    input.value =
        "";


    input.style.height =
        "auto";


    if (text) {

        addMessage(
            "user",
            text
        );

    }

    else {

        addMessage(
            "user",
            "[Imagen enviada]"
        );

    }


    clearImage();


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message assistant";


    thinking.id =
        "thinking";


    thinking.innerHTML = `

        <div class="message-content">

            <div class="thinking">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    document
        .getElementById("chat")
        .appendChild(
            thinking
        );


    const chat =
        document.getElementById(
            "chat"
        );


    chat.scrollTop =
        chat.scrollHeight;


    try {

        /*
            AbortController:
            evitamos que una petición quede
            colgada indefinidamente.

            Le damos 90 segundos.
        */

        const controller =
            new AbortController();


        const timeout =
            setTimeout(

                () => {

                    controller.abort();

                },

                90000

            );


        const response =
            await fetch(

                WORKER_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            image:
                                imageToSend

                        }),

                    signal:
                        controller.signal

                }

            );


        clearTimeout(
            timeout
        );


        const data =
            await response.json();


        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (
            thinkingElement
        ) {

            thinkingElement.remove();

        }


        if (
            !response.ok
        ) {

            addMessage(

                "assistant",

                "No pude conectarme con mi cerebro ahora mismo.\n\n" +
                (
                    data.error ||
                    "Error desconocido."
                )

            );

            return;

        }


        if (
            data.reply &&
            typeof data.reply === "string"
        ) {

            addMessage(

                "assistant",

                data.reply

            );

        }

        else {

            addMessage(

                "assistant",

                "No recibí una respuesta."

            );

        }


        scheduleInitiative();

    }

    catch(error) {

        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (
            thinkingElement
        ) {

            thinkingElement.remove();

        }


        if (
            error.name ===
            "AbortError"
        ) {

            addMessage(

                "assistant",

                "La respuesta tardó demasiado y se canceló. Probá nuevamente."

            );

        }

        else {

            addMessage(

                "assistant",

                "No pude conectarme con mi cerebro ahora mismo.\n\n" +
                error.message

            );

        }

    }

}



/* =====================================================
   SUGERENCIAS
   ===================================================== */

function useSuggestion(
    text
) {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.value =
        text;


    input.focus();

}



/* =====================================================
   IMÁGENES
   ===================================================== */

document
    .getElementById("imageInput")
    .addEventListener(

        "change",

        function(event) {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            if (
                file.size >
                6 * 1024 * 1024
            ) {

                alert(
                    "La imagen es demasiado grande. Máximo 6 MB."
                );


                this.value =
                    "";


                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    selectedImage =
                        e.target.result;


                    document
                        .getElementById(
                            "previewImage"
                        )
                        .src =
                            selectedImage;


                    document
                        .getElementById(
                            "imagePreview"
                        )
                        .style.display =
                            "block";

                };


            reader.readAsDataURL(
                file
            );

        }

    );



function clearImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "previewImage"
        )
        .src =
            "";


    document
        .getElementById(
            "imageInput"
        )
        .value =
            "";

}



/* =====================================================
   ENTER
   ===================================================== */

document
    .getElementById("messageInput")
    .addEventListener(

        "keydown",

        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }

    );



/* =====================================================

document
    .getElementById("messageInput")
    .addEventListener(

        "input",

        function() {

            this.style.height =

/* =====================================================
   INICIATIVA
   ===================================================== */

function randomInitiativeDelay() {

    return Math.floor(

        Math.random() *
        (
            INITIATIVE_MAX_DELAY -
            INITIATIVE_MIN_DELAY
        )

    ) +
    INITIATIVE_MIN_DELAY;

}



function scheduleInitiative() {

    if (
        initiativeTimer
    ) {

        clearTimeout(
            initiativeTimer
        );

    }


    const conversation =
        getActiveConversation();


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        return;

    }


    initiativeTimer =
        setTimeout(

            checkInitiative,

            randomInitiativeDelay()

        );

}



async function checkInitiative() {

    if (
        initiativeChecking
    ) {

        scheduleInitiative();

        return;

    }


    const conversation =
        getActiveConversation();


    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        scheduleInitiative();

        return;

    }


    /*
        No tiene sentido preguntarle a Alicia
        si quiere hablar si el usuario acaba
        de hablar hace unos segundos.
    */

    const idleTime =
        Date.now() -
        conversation.lastUserActivity;


    if (
        idleTime <
        MIN_USER_IDLE
    ) {

        scheduleInitiative();

        return;

    }


    initiativeChecking =
        true;


    try {

        const recent =
            conversation.messages
                .slice(-14)
                .map(
                    message => ({

                        role:
                            message.role,

                        content:
                            message.content

                    })
                );


        const controller =
            new AbortController();


        const timeout =
            setTimeout(

                () => {

                    controller.abort();

                },

                45000

            );


        const response =
            await fetch(

                WORKER_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            initiative:
                                true,

                            conversation:
                                recent

                        }),

                    signal:
                        controller.signal

                }

            );


        clearTimeout(
            timeout
        );


        const data =
            await response.json();


        if (
            response.ok &&
            data.initiative === true &&
            typeof data.reply === "string" &&
            data.reply.trim()
        ) {

            /*
                Verificamos que siga siendo
                la misma conversación.

                Esto evita que una respuesta
                atrasada aparezca en otra conversación.
            */

            if (
                conversation.id ===
                activeConversationId
            ) {

                addMessage(

                    "assistant",

                    data.reply.trim()

                );

            }

        }

    }

    catch(error) {

        console.log(
            "Iniciativa de Alicia:",
            error
        );

    }

    finally {

        initiativeChecking =
            false;


        /*
            No hacemos consultas constantes.

            Alicia volverá a evaluar después
            de otro intervalo largo.
        */

        scheduleInitiative();

    }

}

        if (

            "visible"
        ) {

        }
