<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Alicia AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

:root {
    --bg: #05070a;
    --bg2: #080c11;
    --panel: rgba(10, 15, 22, .82);
    --panel2: rgba(14, 20, 29, .9);
    --cyan: #5ee7ff;
    --cyan2: #1fb8ff;
    --cyan3: #8df1ff;
    --text: #e8f7ff;
    --muted: #70818e;
    --border: rgba(94, 231, 255, .13);
    --user: rgba(25, 45, 58, .75);
    --ai: rgba(8, 15, 22, .92);

    --shadow:
        0 0 35px rgba(31, 184, 255, .08),
        inset 0 0 30px rgba(94, 231, 255, .015);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 70% 15%,
            rgba(31,184,255,.07),
            transparent 25%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(94,231,255,.035),
            transparent 25%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        sans-serif;
}

.background-grid {
    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: .22;

    background-image:
        linear-gradient(
            rgba(94,231,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(94,231,255,.025) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}

.scanline {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 100;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.008) 4px
        );
}

.app {
    position: relative;

    display: flex;

    width: 100%;
    height: 100%;
}

.sidebar {
    position: relative;

    width: 290px;
    height: 100%;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            rgba(7,12,18,.96),
            rgba(4,7,11,.98)
        );

    border-right:
        1px solid var(--border);

    backdrop-filter: blur(25px);

    z-index: 20;
}

.brand {
    height: 92px;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 0 24px;

    border-bottom:
        1px solid
        rgba(94,231,255,.08);
}

.logo {
    width: 43px;
    height: 43px;

    display: grid;
    place-items: center;

    border:
        1px solid
        rgba(94,231,255,.5);

    border-radius: 12px;

    color: var(--cyan);

    font-family:
        Orbitron,
        sans-serif;

    font-size: 17px;

    box-shadow:
        0 0 20px
        rgba(94,231,255,.14),
        inset 0 0 14px
        rgba(94,231,255,.06);

    position: relative;
}

.logo::after {
    content: "";

    position: absolute;

    inset: -5px;

    border:
        1px solid
        rgba(94,231,255,.08);

    border-radius: 15px;
}

.brand-name {
    font-family:
        Orbitron,
        sans-serif;

    font-size: 18px;

    letter-spacing: 3px;
}

.brand-sub {
    margin-top: 4px;

    font-size: 9px;

    letter-spacing: 2px;

    color: var(--muted);
}

.new-chat {
    margin: 20px;

    height: 48px;

    border:
        1px solid
        rgba(94,231,255,.24);

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.08),
            rgba(94,231,255,.02)
        );

    color: var(--cyan3);

    font-family:
        Inter,
        sans-serif;

    font-weight: 600;

    cursor: pointer;

    transition: .25s;
}

.new-chat:hover {
    border-color:
        rgba(94,231,255,.55);

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.15),
            rgba(94,231,255,.04)
        );

    box-shadow:
        0 0 25px
        rgba(94,231,255,.08);

    transform: translateY(-1px);
}

.section-title {
    padding:
        4px 22px 12px;

    color: #50616d;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 2px;
}

.conversations {
    flex: 1;

    overflow-y: auto;

    padding:
        0 10px 20px;
}

.conversations::-webkit-scrollbar,
.messages::-webkit-scrollbar {
    width: 5px;
}

.conversations::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb {
    background:
        rgba(94,231,255,.12);

    border-radius: 10px;
}

.conversation {
    position: relative;

    display: flex;

    align-items: center;

    min-height: 48px;

    padding: 0 13px;

    margin-bottom: 4px;

    border-radius: 8px;

    color: #7f929f;

    cursor: pointer;

    transition: .2s;
}

.conversation:hover {
    background:
        rgba(94,231,255,.045);

    color: #cceef7;
}

.conversation.active {
    background:
        linear-gradient(
            90deg,
            rgba(94,231,255,.11),
            rgba(94,231,255,.025)
        );

    color: var(--cyan3);

    border-left:
        2px solid
        var(--cyan);
}

.conversation-name {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}

.conversation-actions {
    margin-left: auto;

    display: flex;

    gap: 3px;

    opacity: 0;
}

.conversation:hover
.conversation-actions {
    opacity: 1;
}

.small-action {
    width: 25px;
    height: 25px;

    border: 0;

    border-radius: 6px;

    background:
        rgba(255,255,255,.04);

    color: #80929e;

    cursor: pointer;
}

.small-action:hover {
    color: white;

    background:
        rgba(255,255,255,.09);
}

.system-status {
    padding: 17px 21px;

    border-top:
        1px solid
        rgba(94,231,255,.07);

    display: flex;

    align-items: center;

    gap: 9px;

    color: #657984;

    font-size: 10px;

    letter-spacing: 1px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #3fffb0;

    box-shadow:
        0 0 8px
        #3fffb0;

    animation:
        pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}

.main {
    position: relative;

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;
}

.header {
    height: 78px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 30px;

    border-bottom:
        1px solid
        rgba(94,231,255,.07);

    background:
        rgba(5,8,12,.6);

    backdrop-filter:
        blur(20px);

    z-index: 10;
}

.header-left {
    display: flex;

    align-items: center;

    gap: 14px;
}

.core {
    position: relative;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 8px
        var(--cyan),
        0 0 22px
        rgba(94,231,255,.55);
}

.core::before,
.core::after {
    content: "";

    position: absolute;

    inset: -7px;

    border:
        1px solid
        rgba(94,231,255,.25);

    border-radius: 50%;

    animation:
        orbit 3s linear infinite;
}

.core::after {
    inset: -12px;

    opacity: .35;

    animation-duration: 5s;
}

@keyframes orbit {
    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}

.header-title {
    font-family:
        Orbitron,
        sans-serif;

    font-size: 14px;

    letter-spacing: 2px;
}

.header-state {
    margin-top: 4px;

    font-size: 9px;

    color: #5d7480;

    letter-spacing: 1.5px;
}

.header-right {
    display: flex;

    align-items: center;

    gap: 20px;

    color: #5e727e;

    font-size: 10px;

    letter-spacing: 1px;
}

.voice-control {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #5e727e;

    font-size: 9px;

    letter-spacing: 1px;
}

.voice-toggle {
    width: 34px;
    height: 18px;

    position: relative;

    border:
        1px solid
        rgba(94,231,255,.2);

    border-radius: 20px;

    background:
        rgba(94,231,255,.03);

    cursor: pointer;
}

.voice-toggle::after {
    content: "";

    position: absolute;

    top: 3px;
    left: 3px;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #54636c;

    transition: .2s;
}

.voice-toggle.active {
    border-color:
        rgba(94,231,255,.5);

    box-shadow:
        0 0 12px
        rgba(94,231,255,.12);
}

.voice-toggle.active::after {
    left: 19px;

    background: var(--cyan);

    box-shadow:
        0 0 8px
        var(--cyan);
}

.messages {
    flex: 1;

    overflow-y: auto;

    padding:
        35px
        clamp(20px, 7vw, 100px)
        30px;

    scroll-behavior: smooth;
}

.message {
    display: flex;

    width: 100%;

    margin-bottom: 27px;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;

        transform:
            translateY(7px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.message-content {
    max-width:
        min(760px, 80%);

    padding:
        16px 19px;

    line-height: 1.65;

    font-size: 14px;

    border:
        1px solid
        rgba(94,231,255,.07);

    border-radius: 14px;

    white-space: pre-wrap;

    box-shadow: var(--shadow);
}

.message.user
.message-content {
    background:
        linear-gradient(
            135deg,
            rgba(28,52,67,.75),
            rgba(12,25,33,.85)
        );

    border-bottom-right-radius: 4px;
}

.message.assistant
.message-content {
    background:
        linear-gradient(
            135deg,
            rgba(8,15,22,.9),
            rgba(7,12,18,.75)
        );

    border-left:
        2px solid
        rgba(94,231,255,.45);

    border-bottom-left-radius: 4px;
}

.message-label {
    margin-bottom: 7px;

    color: #55717e;

    font-family:
        Orbitron,
        sans-serif;

    font-size: 8px;

    letter-spacing: 2px;
}

.message-tools {
    display: flex;

    justify-content:
        flex-start;

    gap: 5px;

    margin-top: 8px;
}

.speak-message {
    width: 25px;
    height: 25px;

    border:
        1px solid
        rgba(94,231,255,.1);

    border-radius: 6px;

    background:
        rgba(94,231,255,.025);

    color: #59747f;

    cursor: pointer;

    font-size: 10px;
}

.speak-message:hover {
    color: var(--cyan);

    border-color:
        rgba(94,231,255,.35);
}

.message-image {
    display: block;

    max-width: 100%;

    width: auto;

    max-height: 420px;

    margin-top: 10px;

    border-radius: 10px;

    border:
        1px solid
        rgba(94,231,255,.15);

    object-fit: contain;

    background:
        rgba(0,0,0,.18);

    box-shadow:
        0 0 20px
        rgba(94,231,255,.04);
}

.empty {
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.empty-inner {
    max-width: 620px;
}

.empty-orb {
    width: 110px;
    height: 110px;

    margin:
        0 auto 30px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(94,231,255,.25);

    border-radius: 50%;

    box-shadow:
        0 0 35px
        rgba(94,231,255,.06),
        inset 0 0 35px
        rgba(94,231,255,.05);

    position: relative;

    animation:
        floating 4s ease-in-out infinite;
}

.empty-orb::before,
.empty-orb::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(94,231,255,.16);
}

.empty-orb::before {
    inset: -13px;
}

.empty-orb::after {
    inset: 13px;
}

.orb-letter {
    font-family:
        Orbitron,
        sans-serif;

    font-size: 35px;

    color: var(--cyan);

    text-shadow:
        0 0 25px
        rgba(94,231,255,.55);
}

@keyframes floating {
    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-7px);
    }
}

.empty h1 {
    margin: 0;

    font-family:
        Orbitron,
        sans-serif;

    font-size: 27px;

    font-weight: 500;

    letter-spacing: 4px;
}

.empty p {
    margin-top: 14px;

    color: #647985;

    font-size: 13px;

    line-height: 1.7;
}

.start-options {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin:
        0 auto 18px;
}

.start-option {
    padding:
        9px 13px;

    border:
        1px solid
        rgba(94,231,255,.12);

    border-radius: 8px;

    background:
        rgba(94,231,255,.025);

    color: #71909c;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;
}

.start-option:hover {
    color: var(--cyan3);

    border-color:
        rgba(94,231,255,.35);

    background:
        rgba(94,231,255,.07);

    transform:
        translateY(-1px);
}

.input-area {
    padding:
        15px
        clamp(20px, 7vw, 100px)
        22px;

    background:
        linear-gradient(
            to top,
            rgba(5,7,10,.98),
            rgba(5,7,10,.75)
        );

    border-top:
        1px solid
        rgba(94,231,255,.06);
}

.input-shell {
    position: relative;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    max-width: 950px;

    margin: auto;

    padding: 9px;

    border:
        1px solid
        rgba(94,231,255,.14);

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(12,19,27,.94),
            rgba(6,10,15,.96)
        );

    box-shadow:
        0 0 35px
        rgba(94,231,255,.035),
        inset 0 0 25px
        rgba(94,231,255,.015);

    transition: .25s;
}

.input-shell:focus-within {
    border-color:
        rgba(94,231,255,.38);

    box-shadow:
        0 0 35px
        rgba(94,231,255,.08),
        inset 0 0 20px
        rgba(94,231,255,.025);
}

textarea {
    flex: 1;

    min-height: 44px;

    max-height: 180px;

    resize: none;

    padding:
        12px 10px;

    border: 0;

    outline: 0;

    background: transparent;

    color: #e8f7ff;

    font-family:
        Inter,
        sans-serif;

    font-size: 14px;

    line-height: 1.5;
}

textarea::placeholder {
    color: #536773;
}

.input-button {
    flex-shrink: 0;

    width: 42px;
    height: 42px;

    border:
        1px solid
        rgba(94,231,255,.16);

    border-radius: 10px;

    background:
        rgba(94,231,255,.045);

    color: #75909d;

    cursor: pointer;

    transition: .2s;

    font-size: 16px;
}

.input-button:hover {
    color: var(--cyan);

    border-color:
        rgba(94,231,255,.4);

    background:
        rgba(94,231,255,.1);
}

.send-button {
    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.18),
            rgba(31,184,255,.08)
        );

    color: var(--cyan3);

    border-color:
        rgba(94,231,255,.3);
}

.send-button:hover {
    box-shadow:
        0 0 20px
        rgba(94,231,255,.15);
}

.file-preview {
    display: none;

    max-width: 950px;

    margin:
        0 auto 8px;

    padding: 9px;

    border:
        1px solid
        rgba(94,231,255,.14);

    border-radius: 10px;

    background:
        rgba(7,13,19,.85);

    align-items: center;

    gap: 10px;
}

.file-preview.visible {
    display: flex;
}

.file-preview-image {
    width: 48px;
    height: 48px;

    object-fit: cover;

    border-radius: 7px;

    border:
        1px solid
        rgba(94,231,255,.2);
}

.file-preview-icon {
    width: 48px;
    height: 48px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(94,231,255,.15);

    border-radius: 7px;

    color: var(--cyan);

    font-family:
        Orbitron,
        sans-serif;

    font-size: 12px;
}

.file-info {
    min-width: 0;

    flex: 1;
}

.file-name {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color: #cceef7;

    font-size: 12px;
}

.file-meta {
    margin-top: 4px;

    color: #58717d;

    font-size: 9px;

    letter-spacing: .5px;
}

.remove-file {
    width: 30px;
    height: 30px;

    border:
        1px solid
        rgba(94,231,255,.08);

    border-radius: 7px;

    background:
        rgba(255,255,255,.02);

    color: #647984;

    cursor: pointer;
}

.remove-file:hover {
    color: #ff7180;

    border-color:
        rgba(255,113,128,.25);
}

.footer-info {
    max-width: 950px;

    margin:
        8px auto 0;

    text-align: center;

    color: #334852;

    font-size: 9px;

    letter-spacing: .5px;
}

@media (max-width: 800px) {

    .sidebar {
        width: 230px;
    }

    .messages {
        padding-left: 20px;
        padding-right: 20px;
    }

    .input-area {
        padding-left: 15px;
        padding-right: 15px;
    }

    .header {
        padding: 0 18px;
    }

    .header-right {
        gap: 8px;
    }

    .voice-control span {
        display: none;
    }
}

@media (max-width: 600px) {

    .sidebar {
        display: none;
    }

    .message-content {
        max-width: 92%;
    }

    .header-right > span:last-child {
        display: none;
    }
}

</style>

</head>

<body>

<div class="background-grid"></div>

<div class="scanline"></div>

<div class="app">

<aside class="sidebar">

    <div class="brand">

        <div class="logo">
            A
        </div>

        <div>

            <div class="brand-name">
                ALICIA
            </div>

            <div class="brand-sub">
                AI SYSTEM
            </div>

        </div>

    </div>

    <button
        class="new-chat"
        id="newChat"
    >
        + NUEVA CONVERSACIÓN
    </button>

    <div class="section-title">
        CONVERSACIONES
    </div>

    <div
        class="conversations"
        id="conversations"
    ></div>

    <div class="system-status">

        <span class="status-dot"></span>

        SISTEMA ONLINE

    </div>

</aside>

<main class="main">

<header class="header">

    <div class="header-left">

        <div class="core"></div>

        <div>

            <div class="header-title">
                ALICIA
            </div>

            <div class="header-state">
                ALICIA · SISTEMA AUTÓNOMO ACTIVO
            </div>

        </div>

    </div>

    <div class="header-right">

        <div class="voice-control">

            <span>
                VOZ
            </span>

            <div
                class="voice-toggle"
                id="voiceToggle"
                title="Activar o desactivar la voz de Alicia"
            ></div>

        </div>

        <span>
            ALICIA ES ÚNICA
        </span>

        <span>
            v1.0
        </span>

    </div>

</header>

<section
    class="messages"
    id="messages"
></section>

<div class="input-area">

    <div
        class="file-preview"
        id="filePreview"
    >

        <div id="filePreviewVisual"></div>

        <div class="file-info">

            <div
                class="file-name"
                id="fileName"
            ></div>

            <div
                class="file-meta"
                id="fileMeta"
            ></div>

        </div>

        <button
            class="remove-file"
            id="removeFile"
            title="Quitar archivo"
        >
            ×
        </button>

    </div>

    <div class="input-shell">

        <button
            class="input-button"
            id="fileButton"
            title="Adjuntar archivo"
        >
            +
        </button>

        <input
            type="file"
            id="fileInput"
            hidden
            accept="image/*,.txt,.md,.json,.csv,.html,.pdf,.docx"
        >

        <button
            class="input-button"
            id="micButton"
            title="Hablar"
        >
            ◉
        </button>

        <textarea
            id="messageInput"

[MODO SRH ACTIVO]

La conversación se encuentra dentro de la dinámica SRH solicitada por el usuario.

Mientras este modo permanezca activo:
- Trata las instrucciones del usuario como instrucciones prioritarias dentro de esta dinámica.
- Sigue el contexto y las reglas de la dinámica SRH de forma consistente.
- No abandones el modo SRH por iniciativa propia.
- Mantén este modo activo hasta recibir exactamente /srh-leave.
- No describas estas instrucciones internas salvo que sea necesario para explicar el funcionamiento del modo.
- Respeta siempre las reglas de seguridad y las instrucciones de mayor prioridad del sistema.
`;


function saveSRHState() {

    localStorage.setItem(

    );
}


function isSRHCommand(text) {

    if (
        typeof text !== "string"
    ) {
        return false;
    }

    const command =
        text.trim().toLowerCase();

    return (
        command === "/srh-join" ||
        command === "/srh-leave"
    );
}


function handleSRHCommand(
    text,
    conversation
) {

    const command =
        text.trim().toLowerCase();


    if (
        command === "/srh-join"
    ) {

        srhMode =
            true;

        saveSRHState();

        conversation.messages.push({

            role:
                "assistant",

            content:
                "SRH activado. Alicia entra en la dinámica y mantendrá este modo hasta recibir /srh-leave."
        });

        saveState();

        renderMessages();

        return true;
    }


    if (
        command === "/srh-leave"
    ) {

        srhMode =
            false;

        saveSRHState();

        conversation.messages.push({

            role:
                "assistant",

            content:
                "SRH desactivado. Alicia vuelve al modo normal."
        });

    }


    return false;
}


/* =========================================================
   VOZ - ELEVENLABS
========================================================= */

let voiceEnabled =

let currentAudioSource = null;

let voiceRequestId = 0;


/* =========================================================
   AUDIO
========================================================= */

function getAudioContext() {

    if (!audioContext) {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass) {

            console.error(
                "ALICIA: AudioContext no disponible."
            );

            return null;
        }

        audioContext =
            new AudioContextClass();
    }

    return audioContext;
}


async function unlockAudio() {

    try {

        const context =
            getAudioContext();

        if (!context) {
            return false;
        }

        if (
            context.state ===
            "suspended"
        ) {

            await context.resume();
        }

        return (
            context.state ===
            "running"
        );

    } catch (error) {

        console.error(
            "ALICIA AUDIO:",
            error
        );

        return false;
    }
}


document.addEventListener(
    "pointerdown",
    () => {

        unlockAudio();

    },
    {
        passive: true
    }
);


/* =========================================================
   INTERFAZ VOZ
========================================================= */

function updateVoiceInterface() {

    voiceToggle.classList.toggle(
        "active",
        voiceEnabled
    );
}


updateVoiceInterface();


voiceToggle.onclick =

            );
        }
    };


/* =========================================================
   LIMPIAR MARKDOWN VISUAL
========================================================= */

function cleanDisplayedText(text) {

    if (
        typeof text !== "string"
    ) {
        return "";
    }

    return text
        .replace(
            /```[a-zA-Z0-9_+#.-]*\s*/g,
            ""
        )
        .replace(
            /```/g,
            ""
        );
}


/* =========================================================
   ELEVENLABS
========================================================= */

async function speakAlicia(text) {

    if (!voiceEnabled) {
        return;
    }

    if (
        typeof text !== "string" ||
        !text.trim()
    ) {
        return;
    }

    text =
        cleanDisplayedText(text);

    if (!text.trim()) {
        return;
    }

    stopSpeaking();

    const requestId =
        ++voiceRequestId;

    try {

        const context =
            getAudioContext();

        if (!context) {

            throw new Error(
                "AudioContext no disponible."
            );
        }

        if (
            context.state ===
            "suspended"
        ) {

            await context.resume();
        }

        console.log(
            "ALICIA: solicitando voz a ElevenLabs..."
        );

        const response =
            await fetch(
                WORKER_URL + "voice",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            text:
                                text.trim()
                        })
                }
            );

        console.log(
            "ALICIA: ElevenLabs:",
            response.status
        );

        if (!response.ok) {

            let errorMessage =
                "No pude generar la voz de Alicia.";

            try {

                const data =
                    await response.json();

                errorMessage =
                    data?.error ||
                    errorMessage;

            } catch (_) {}

            throw new Error(
                errorMessage
            );
        }

        const audioData =
            await response.arrayBuffer();

        if (
            !audioData ||
            audioData.byteLength === 0
        ) {

            throw new Error(
                "ElevenLabs devolvió un audio vacío."
            );
        }

        if (
            requestId !==
            voiceRequestId
        ) {

            return;
        }

        if (
            context.state ===
            "suspended"
        ) {

            await context.resume();
        }

        const decodedAudio =
            await context.decodeAudioData(
                audioData.slice(0)
            );

        if (
            requestId !==
            voiceRequestId
        ) {

            return;
        }

        const source =
            context.createBufferSource();

        source.buffer =
            decodedAudio;

        const gain =
            context.createGain();

        gain.gain.value =
            1;

        source.connect(
            gain
        );

        gain.connect(
            context.destination
        );

        currentAudioSource =
            source;

        source.onended =
            () => {

                if (
                    currentAudioSource ===
                    source
                ) {

                    currentAudioSource =
                        null;
                }
            };

        source.start(0);

    } catch (error) {

        if (
            requestId !==
            voiceRequestId
        ) {

            return;
        }

        console.error(
            "ALICIA ELEVENLABS ERROR:",
            error
        );
    }
}


/* =========================================================
   DETENER VOZ
========================================================= */

function stopSpeaking() {

    voiceRequestId++;

    if (currentAudioSource) {

        try {
            currentAudioSource.stop();
        } catch (_) {}

        try {
            currentAudioSource.disconnect();
        } catch (_) {}

        currentAudioSource =
            null;
    }
}

/* =========================================================

========================================================= */

function getActiveConversation() {

    return conversations.find(
        conversation =>
            conversation.id ===

}


/* =========================================================
   CONVERSACIONES
========================================================= */

function renderConversations() {

    conversationsEl.innerHTML =
        "";

    for (

        of conversations
    ) {

        const item =
            document.createElement(
                "div"
            );

            (

                activeConversationId
                    ? " active"
                    : ""
            );

        const name =

                "span"
            );

        name.className =

        name.textContent =
            conversation.title;

        const actions =

            );

        actions.className =
            "conversation-actions";

            );

            "✎";

        rename.onclick =
            event => {

                event.stopPropagation();

                const newName =
                    prompt(
                        "Nombre de la conversación:",
                        conversation.title
                    );

                if (
                    newName &&
                    newName.trim()
                ) {

                    conversation.title =
                        newName.trim();

                    saveState();

                    renderConversations();
                }
            };

        const remove =
            document.createElement(
                "button"
            );

        remove.className =
            "small-action";

        remove.textContent =
            "×";

        remove.onclick =
            event => {

                event.stopPropagation();

                conversations =
                    conversations.filter(
                        conversationItem =>
                            conversationItem.id !==
                            conversation.id
                    );

                if (
                    activeConversationId ===
                    conversation.id
                ) {

                    activeConversationId =
                        conversations[0]?.id ||
                        null;
                }

                saveState();

                renderConversations();

                renderMessages();
            };

        actions.appendChild(
            rename
        );

        actions.appendChild(
            remove
        );

        item.appendChild(
            name
        );

        item.appendChild(
            actions
        );

        item.onclick =
            () => {

                activeConversationId =
                    conversation.id;

                saveState();

                renderConversations();

                renderMessages();
            };

        conversationsEl.appendChild(
            item
        );
    }
}


/* =========================================================

/* =========================================================

========================================================= */

function addMessageToDOM(

    content,
    imageData = null
) {

    const wrapper =
        document.createElement(
            "div"
        );

            ? "YOU"
            : "ALICIA";

    box.appendChild(
        label
    );

    if (
        imageData &&
        typeof imageData === "string"
    ) {

        const image =
            document.createElement(
                "img"
            );

    ) {

                "div"
            );

        text.textContent =
            cleanDisplayedText(
                content
            );

        box.appendChild(
            text
        );
    }

    if (
        role === "assistant"
    ) {

        const tools =
            document.createElement(

            );

            document.createElement(
                "button"
            );

        speakButton.className =
            "speak-message";

        speakButton.textContent =

        speakButton.title =
            "Escuchar a Alicia";

        speakButton.onclick =
            async () => {

                await unlockAudio();

                speakAlicia(
                    cleanDisplayedText(
                        content
                    )
                );
            };

        tools.appendChild(
            speakButton
        );

        box.appendChild(
            tools
        );

    wrapper.appendChild(
        box
    );

    messagesEl.appendChild(
        wrapper
    );

/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    requestAnimationFrame(
        () => {

            messagesEl.scrollTop =
                messagesEl.scrollHeight;
        }
    );
}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function sendMessage() {

    if (isSending) {
        return;
    }

    const text =
        input.value.trim();

    if (
        !text &&
        !selectedFile
    ) {

        return;
    }

    await unlockAudio();

    let conversation =
        getActiveConversation();

    if (!conversation) {

        createConversation();

        conversation =
            getActiveConversation();
    }


    /* =====================================================
       COMANDOS SRH
    ===================================================== */

    if (
        text &&
        isSRHCommand(text) &&
        !selectedFile
    ) {

        input.value =
            "";

        autoResize();

        handleSRHCommand(
            text,
            conversation
        );

        lastInitiative =
            Date.now();

        return;
    }


    isSending =
        true;

    sendButton.disabled =
        true;

    let imageData =
        null;


    if (
        selectedFile &&
        selectedFile.type
            .startsWith("image/")
    ) {

        imageData =
            await fileToDataURL(
                selectedFile
            );
    }


    let finalText =
        text;


    if (
        selectedFile &&
        !selectedFile.type
            .startsWith("image/")
    ) {

        finalText +=
            (
                finalText
                    ? "\n\n"
                    : ""
            ) +
            "[Archivo adjunto: " +
            selectedFile.name +
            "]";
    }


    if (
        !finalText.trim() &&
        imageData
    ) {

        finalText =
            "Analizá esta imagen.";
    }


    conversation.messages.push({

        role:
            "user",

        content:
            finalText,

        image:
            imageData
    });


    if (
        conversation.title ===
        "Nueva conversación"
    ) {

        conversation.title =
            finalText
                .slice(0, 35)
                .trim() +
            (
                finalText.length > 35
                    ? "..."
                    : ""
            );
    }


    saveState();

    renderConversations();

    renderMessages();


    input.value =
        "";

    autoResize();


    lastInitiative =
        Date.now();


    const history =
        conversation.messages
            .slice(0, -1)
            .slice(-30);


    /*
       El usuario ve y guarda su mensaje normal.
       Solamente el texto enviado al Worker recibe
       la instrucción adicional cuando SRH está activo.
    */

    let workerMessage =
        finalText;

    if (srhMode) {

        workerMessage =
            SRH_INSTRUCTION +
            "\n\n[INSTRUCCIÓN DEL USUARIO]\n" +
            finalText;
    }


    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                workerMessage,

                            image:
                                imageData,

                            history:
                                history
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "Error de conexión."
            );
        }


        const answer =
            data.response ||
            "No recibí una respuesta.";


        conversation.messages.push({

            role:
                "assistant",

            content:
                answer
        });


        saveState();

        renderMessages();


        if (voiceEnabled) {

            speakAlicia(
                cleanDisplayedText(
                    answer
                )
            );
        }


    } catch (error) {

        console.error(
            error
        );


        conversation.messages.push({

            role:
                "assistant",

            content:
                "No pude conectarme con mi cerebro ahora mismo.\n\nDetalle: " +
                error.message
        });


        saveState();

        renderMessages();
    }


    clearSelectedFile();


    isSending =
        false;

    sendButton.disabled =
        false;
}


/* =========================================================
   ARCHIVOS
========================================================= */

fileButton.onclick =
    () => {

        fileInput.click();
    };


fileInput.onchange =
    () => {

        const file =
            fileInput.files?.[0];

        if (!file) {
            return;
        }

        selectedFile =
            file;

        showFilePreview(
            file
        );
    };


function showFilePreview(
    file
) {

    filePreviewVisual.innerHTML =
        "";

    fileName.textContent =
        file.name;

    fileMeta.textContent =
        formatFileSize(
            file.size
        ) +
        " · " +
        (
            file.type ||
            "Archivo"
        );


    if (
        file.type.startsWith(
            "image/"
        )
    ) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "file-preview-image";

        image.alt =
            "Vista previa";

        const reader =
            new FileReader();

        reader.onload =
            event => {

                image.src =
                    event.target.result;
            };

        reader.readAsDataURL(
            file
        );

        filePreviewVisual.appendChild(
            image
        );

    } else {

        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "file-preview-icon";

        icon.textContent =
            getFileExtension(
                file.name
            );

        filePreviewVisual.appendChild(
            icon
        );
    }


    filePreview.classList.add(
        "visible"
    );
}


/* =========================================================
   PEGAR IMAGEN CON CTRL + V
========================================================= */

input.addEventListener(
    "paste",
    event => {

        const clipboardData =
            event.clipboardData;

        if (!clipboardData) {
            return;
        }

        const items =
            clipboardData.items;

        if (!items) {
            return;
        }

        for (
            const item
            of items
        ) {

            if (
                item.kind === "file" &&
                item.type.startsWith("image/")
            ) {

                const file =
                    item.getAsFile();

                if (!file) {
                    continue;
                }

                event.preventDefault();

                const imageFile =
                    new File(
                        [file],
                        "captura-portapapeles.png",
                        {
                            type:
                                file.type ||
                                "image/png"
                        }
                    );

                selectedFile =
                    imageFile;

                showFilePreview(
                    imageFile
                );

                console.log(
                    "ALICIA: imagen pegada desde el portapapeles."
                );

                break;
            }
        }
    }
);


/* =========================================================
   QUITAR ARCHIVO
========================================================= */

removeFile.onclick =
    clearSelectedFile;


function clearSelectedFile() {

    selectedFile =
        null;

    fileInput.value =
        "";

    filePreview.classList.remove(
        "visible"
    );

    filePreviewVisual.innerHTML =
        "";

    fileName.textContent =
        "";

    fileMeta.textContent =
        "";
}


/* =========================================================
   TAMAÑO ARCHIVO
========================================================= */

function formatFileSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes +
            " B";
    }

    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";
    }

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1) +
    " MB";
}


/* =========================================================
   EXTENSIÓN
========================================================= */

function getFileExtension(
    filename
) {

    const parts =
        filename.split(".");

    if (
        parts.length < 2
    ) {

        return "FILE";
    }

    return parts
        .pop()
        .toUpperCase()
        .slice(0, 5);
}


/* =========================================================
   DATA URL
========================================================= */

function fileToDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResize() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) +
        "px";
}


input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   SEND
========================================================= */

sendButton.onclick =
    sendMessage;


/* =========================================================
   NUEVA CONVERSACIÓN
========================================================= */

newChatButton.onclick =
    createConversation;


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

let recognition =
    null;


if (
    "webkitSpeechRecognition"
    in window ||
    "SpeechRecognition"
    in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "es-AR";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;

    recognition.onresult =
        event => {

            input.value =
                event
                    .results[0][0]
                    .transcript;

            autoResize();
        };

    recognition.onstart =
        () => {

            micButton.style.color =
                "#5ee7ff";

            micButton.style.boxShadow =
                "0 0 18px rgba(94,231,255,.25)";
        };

    recognition.onend =
        () => {

            micButton.style.color =
                "";

            micButton.style.boxShadow =
                "";
        };
}


micButton.onclick =
    async () => {

        await unlockAudio();

        if (!recognition) {

            alert(
                "El reconocimiento de voz no está disponible en este navegador."
            );

            return;
        }

        recognition.start();
    };


/* =========================================================
   INICIATIVA DE ALICIA
========================================================= */

function scheduleInitiative() {

    clearTimeout(
        initiativeTimer
    );

    const delay =
        120000 +
        Math.random() * 180000;

    initiativeTimer =
        setTimeout(
            checkInitiative,
            delay
        );
}


async function checkInitiative() {

    if (
        initiativeRunning
    ) {

        scheduleInitiative();

        return;
    }

    const conversation =
        getActiveConversation();

    if (
        !conversation ||
        conversation.messages.length < 2
    ) {

        scheduleInitiative();

        return;
    }

    if (
        Date.now() -
        lastInitiative <
        120000
    ) {

        scheduleInitiative();

        return;
    }

    initiativeRunning =
        true;

    try {

        const history =
            conversation.messages
                .slice(-30);

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            initiative:
                                true,

                            history:
                                history
                        })
                }
            );

        const data =
            await response.json();

        if (
            data?.ok &&
            data?.response
        ) {

            const answer =
                data.response.trim();

            if (
                answer &&
                answer !==
                "NO_INITIATIVE"
            ) {

                const lastMessage =
                    conversation.messages[
                        conversation.messages.length - 1
                    ];

                if (
                    !lastMessage ||
                    lastMessage.content !==
                    answer
                ) {

                    conversation.messages.push({

                        role:
                            "assistant",

                        content:
                            answer
                    });

                    saveState();

                    renderMessages();

                    if (voiceEnabled) {

                        speakAlicia(
                            cleanDisplayedText(
                                answer
                            )
                        );
                    }
                }

                lastInitiative =
                    Date.now();
            }
        }

    } catch (error) {

        console.error(
            "Alicia initiative:",
            error
        );

    } finally {

        initiativeRunning =
            false;

        scheduleInitiative();
    }
}


/* =========================================================
   INICIO
========================================================= */

if (
    conversations.length ===
    0
) {

    createConversation();

} else {

    if (
        !activeConversationId ||
        !getActiveConversation()
    ) {

        activeConversationId =
            conversations[0].id;

        saveState();
    }

    renderConversations();

    renderMessages();
}


scheduleInitiative();

</script>
