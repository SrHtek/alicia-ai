<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Alicia AI</title>


<style>

/* =====================================================
   INTERFAZ ORIGINAL
   ===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    background: #05070a;

    color: #eafcff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    height: 100vh;

    overflow: hidden;

}


.app {

    width: 100%;

    height: 100vh;

    display: flex;

}


.sidebar {

    width: 260px;

    background: #080d12;

    border-right:
        1px solid
        rgba(0, 220, 255, 0.15);

    display: flex;

    flex-direction: column;

}


.logo {

    padding: 25px;

    font-size: 25px;

    font-weight: bold;

    color: #63eaff;

}


.sidebar-info {

    padding: 25px;

    color: #7d8b94;

    font-size: 13px;

    line-height: 1.6;

}


.main {

    flex: 1;

    display: flex;

    flex-direction: column;

    min-width: 0;

}


.header {

    height: 70px;

    display: flex;

    align-items: center;

    padding:
        0 25px;

    border-bottom:
        1px solid
        rgba(0, 220, 255, 0.12);

    background: #070a0e;

}


.status {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #b9c9d0;

}


.status-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: #4de7ff;

    box-shadow:
        0 0 12px
        rgba(77, 231, 255, .8);

}


.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        35px 8%;

}


.message {

    display: flex;

    margin-bottom: 25px;

}


.message.user {

    justify-content: flex-end;

}


.message-content {

    max-width: 750px;

    padding:
        15px 18px;

    border-radius: 15px;

    line-height: 1.55;

    white-space: pre-wrap;

}


.message.assistant .message-content {

    background: #0b1117;

    border:
        1px solid
        rgba(0, 220, 255, .12);

}


.message.user .message-content {

    background: #123541;

    border:
        1px solid
        rgba(0, 220, 255, .2);

}


.welcome {

    text-align: center;

    max-width: 650px;

    margin:
        10vh auto 40px;

}


.welcome h1 {

    font-size: 48px;

    color: #63eaff;

    margin-bottom: 15px;

}


.welcome p {

    color: #83949d;

    line-height: 1.6;

}


.suggestions {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    justify-content: center;

    margin-top: 30px;

}


.suggestion {

    background: #0b1117;

    border:
        1px solid
        rgba(0, 220, 255, .15);

    color: #b7c8cf;

    padding:
        10px 15px;

    border-radius: 10px;

    cursor: pointer;

    transition: .2s;

}


.suggestion:hover {

    border-color:
        rgba(0, 220, 255, .5);

    color: #63eaff;

}


.thinking {

    display: flex;

    gap: 5px;

    padding: 10px;

}


.thinking span {

    width: 7px;

    height: 7px;

    background: #63eaff;

    border-radius: 50%;

    animation:
        thinking 1.2s infinite;

}


.thinking span:nth-child(2) {

    animation-delay:
        .15s;

}


.thinking span:nth-child(3) {

    animation-delay:
        .3s;

}


@keyframes thinking {

    0%, 100% {

        opacity: .25;

        transform:
            translateY(0);

    }

    50% {

        opacity: 1;

        transform:
            translateY(-4px);

    }

}


.input-area {

    padding:
        20px 8%;

    border-top:
        1px solid
        rgba(0, 220, 255, .12);

    background: #070a0e;

}


.input-wrapper {

    display: flex;

    align-items: flex-end;

    gap: 10px;

    background: #0b1117;

    border:
        1px solid
        rgba(0, 220, 255, .2);

    border-radius: 15px;

    padding: 10px;

}


textarea {

    flex: 1;

    resize: none;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    font-size: 15px;

    min-height: 24px;

    max-height: 140px;

}


button {

    border: none;

    cursor: pointer;

}


.send {

    width: 42px;

    height: 42px;

    border-radius: 10px;

    background: #63eaff;

    color: #031014;

    font-weight: bold;

}


.send:hover {

    filter: brightness(1.1);

}


.image-button {

    width: 42px;

    height: 42px;

    border-radius: 10px;

    background: transparent;

    color: #63eaff;

    font-size: 20px;

}


.image-preview {

    display: none;

    margin-bottom: 10px;

}


.image-preview img {

    max-width: 180px;

    max-height: 120px;

    border-radius: 10px;

}


@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .chat {
        padding: 25px 15px;
    }

    .input-area {
        padding: 12px;
    }

    .welcome h1 {
        font-size: 38px;
    }

}

</style>

</head>


<body>


<div class="app">


    <aside class="sidebar">

        <div class="logo">
            ALICIA
        </div>

        <div class="sidebar-info">

            Inteligencia artificial
            conversacional.

            <br><br>

            Alicia puede conversar,
            analizar imágenes y
            tomar iniciativa.

        </div>

    </aside>


    <main class="main">


        <header class="header">

            <div class="status">

                <span class="status-dot"></span>

                Alicia está conectada

            </div>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <h1>
                    Alicia
                </h1>

                <p>
                    Hola. Estoy acá.
                    ¿Qué hacemos?
                </p>


                <div class="suggestions">


                    <div
                        class="suggestion"
                        onclick="useSuggestion('Contame algo interesante')"
                    >

                        Contame algo interesante

                    </div>


                    <div
                        class="suggestion"
                        onclick="useSuggestion('¿Qué podés hacer?')"
                    >

                        ¿Qué podés hacer?

                    </div>


                    <div
                        class="suggestion"
                        onclick="useSuggestion('Analizá esta conversación')"
                    >

                        Analizá esta conversación

                    </div>


                </div>

            </div>

        </section>


        <div class="input-area">


            <div
                class="image-preview"
                id="imagePreview"
            >

                <img
                    id="previewImage"
                >

            </div>


            <div class="input-wrapper">


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >


                <button
                    class="image-button"
                    onclick="
                        document
                        .getElementById('imageInput')
                        .click()
                    "
                >

                    +

                </button>


                <textarea
                    id="messageInput"
                    placeholder="Escribile a Alicia..."
                    rows="1"
                ></textarea>


                <button
                    class="send"
                    onclick="sendMessage()"
                >

                    ↑

                </button>


            </div>

        </div>


    </main>

</div>



<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


const STORAGE_KEY =
    "alicia_conversation_v3";


/*
    Alicia revisará periódicamente si tiene
    un motivo natural para hablar.

    No significa que vaya a hablar cada 2 minutos.
    El modelo decide.
*/

const INITIATIVE_CHECK_MIN =
    90 * 1000;


const INITIATIVE_CHECK_MAX =
    180 * 1000;


let messages = [];

let selectedImage = null;

let initiativeTimer = null;

let initiativeChecking = false;



// =====================================================
// MEMORIA
// =====================================================

function saveConversation() {

    try {

        const data = {

            version: 3,

            savedAt:
                Date.now(),

            messages:
                messages

        };


        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(data)

        );

    }

    catch (error) {

        console.error(
            "No se pudo guardar la conversación:",
            error
        );

    }

}



// =====================================================
// CARGAR MEMORIA
// =====================================================

function loadConversation() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            messages = [];

            return;

        }


        const data =
            JSON.parse(saved);


        // Compatibilidad con formatos anteriores

        if (Array.isArray(data)) {

            messages =
                data;

        }

        else if (
            data &&
            Array.isArray(data.messages)
        ) {

            messages =
                data.messages;

        }

        else {

            messages =
                [];

        }


        // Limpiar datos corruptos

        messages =
            messages.filter(
                item =>
                    item &&
                    (
                        item.role === "user" ||
                        item.role === "assistant"
                    ) &&
                    typeof item.content === "string"
            );


    }

    catch (error) {

        console.error(
            "Error cargando memoria:",
            error
        );

        messages = [];

    }

}



// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}



// =====================================================
// RENDERIZAR
// =====================================================

function renderMessages() {

    const chat =
        document.getElementById("chat");


    const welcome =
        document.getElementById("welcome");


    chat.innerHTML = "";


    if (
        messages.length === 0
    ) {

        if (welcome) {

            chat.appendChild(
                welcome
            );

            welcome.style.display =
                "block";

        }

        return;

    }


    if (welcome) {

        welcome.style.display =
            "none";

    }


    for (
        const message of messages
    ) {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message " +
            message.role;


        const content =
            document.createElement("div");


        content.className =
            "message-content";


        content.innerHTML =
            escapeHTML(
                message.content
            );


        wrapper.appendChild(
            content
        );


        chat.appendChild(
            wrapper
        );

    }


    chat.scrollTop =
        chat.scrollHeight;

}



// =====================================================
// AGREGAR MENSAJE
// =====================================================

function addMessage(
    role,
    content
) {

    if (
        !content ||
        !content.trim()
    ) {

        return;

    }


    messages.push({

        role:
            role,

        content:
            content,

        timestamp:
            Date.now()

    });


    saveConversation();

    renderMessages();

}



// =====================================================
// ENVIAR MENSAJE
// =====================================================

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    const imageToSend =
        selectedImage;


    input.value =
        "";


    input.style.height =
        "auto";


    if (text) {

        addMessage(
            "user",
            text
        );

    }

    else {

        addMessage(
            "user",
            "[Imagen enviada]"
        );

    }


    clearImage();


    const thinking =
        document.createElement("div");


    thinking.className =
        "message assistant";


    thinking.id =
        "thinking";


    thinking.innerHTML = `

        <div class="message-content">

            <div class="thinking">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    document
        .getElementById("chat")
        .appendChild(
            thinking
        );


    const chat =
        document.getElementById(
            "chat"
        );


    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch(

                WORKER_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            image:
                                imageToSend

                        })

                }

            );


        const data =
            await response.json();


        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (thinkingElement) {

            thinkingElement.remove();

        }


        if (!response.ok) {

            addMessage(

                "assistant",

                "No pude conectarme con mi cerebro ahora mismo.\n\n" +
                (
                    data.error ||
                    "Error desconocido."
                )

            );

            return;

        }


        if (
            data.reply &&
            typeof data.reply === "string"
        ) {

            addMessage(
                "assistant",
                data.reply
            );

        }

        else {

            addMessage(

                "assistant",

                "No recibí una respuesta."

            );

        }


        /*
            Después de una conversación normal,
            reiniciamos el reloj de iniciativa.
        */

        scheduleInitiative();

    }

    catch (error) {

        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (thinkingElement) {

            thinkingElement.remove();

        }


        addMessage(

            "assistant",

            "No pude conectarme con mi cerebro ahora mismo.\n\n" +
            error.message

        );

    }

}



// =====================================================
// SUGERENCIAS
// =====================================================

function useSuggestion(text) {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.value =
        text;


    input.focus();

}



// =====================================================
// IMÁGENES
// =====================================================

document
    .getElementById("imageInput")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            if (
                file.size >
                8 * 1024 * 1024
            ) {

                alert(
                    "La imagen es demasiado grande. Máximo 8 MB."
                );

                this.value =
                    "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    selectedImage =
                        e.target.result;


                    document
                        .getElementById(
                            "previewImage"
                        )
                        .src =
                            selectedImage;


                    document
                        .getElementById(
                            "imagePreview"
                        )
                        .style.display =
                            "block";

                };


            reader.readAsDataURL(file);

        }
    );



function clearImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "previewImage"
        )
        .src =
            "";


    document
        .getElementById(
            "imageInput"
        )
        .value =
            "";

}



// =====================================================
// ENTER
// =====================================================

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );



// =====================================================
// AUTO HEIGHT
// =====================================================

document
    .getElementById("messageInput")
    .addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }
    );



// =====================================================
// INICIATIVA
// =====================================================

function getRandomInitiativeDelay() {

    return Math.floor(

        Math.random() *
        (
            INITIATIVE_CHECK_MAX -
            INITIATIVE_CHECK_MIN
        )

    ) +
    INITIATIVE_CHECK_MIN;

}



function scheduleInitiative() {

    if (initiativeTimer) {

        clearTimeout(
            initiativeTimer
        );

    }


    /*
        Si no hay conversación,
        Alicia no tiene contexto suficiente
        para iniciar algo.
    */

    if (
        messages.length === 0
    ) {

        return;

    }


    const delay =
        getRandomInitiativeDelay();


    initiativeTimer =
        setTimeout(

            checkInitiative,

            delay

        );

}



async function checkInitiative() {

    /*
        Evita dos consultas simultáneas.
    */

    if (initiativeChecking) {

        scheduleInitiative();

        return;

    }


    if (
        messages.length === 0
    ) {

        scheduleInitiative();

        return;

    }


    initiativeChecking =
        true;


    try {

        /*
            Mandamos solamente el contexto reciente.
            Las imágenes no se mandan de nuevo acá;
            queda registrado que hubo una imagen.
        */

        const recentConversation =
            messages
                .slice(-16)
                .map(item => ({

                    role:
                        item.role,

                    content:
                        item.content

                }));


        const response =
            await fetch(

                WORKER_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            initiative:
                                true,

                            conversation:
                                recentConversation

                        })

                }

            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.initiative === true &&
            typeof data.reply === "string" &&
            data.reply.trim()
        ) {

            /*
                Alicia decidió hablar.
                Se guarda igual que cualquier respuesta normal.
            */

            addMessage(

                "assistant",

                data.reply.trim()

            );

        }

    }

    catch (error) {

        console.log(
            "Error comprobando iniciativa de Alicia:",
            error
        );

    }

    finally {

        initiativeChecking =
            false;

        /*
            Siempre vuelve a programar
            la siguiente comprobación.
        */

        scheduleInitiative();

    }

}



// =====================================================
// INICIAR ALICIA
// =====================================================

loadConversation();

renderMessages();

scheduleInitiative();



// =====================================================
// SI LA PÁGINA VUELVE A SER VISIBLE
// =====================================================

document.addEventListener(

    "visibilitychange",

    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            /*
                Al volver a la pestaña,
                reiniciamos el sistema de iniciativa.
            */

            scheduleInitiative();

        }

    }

);

</script>

</body>

</html>
