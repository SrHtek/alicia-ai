<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alicia AI</title>

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
            type="module"></script>

    <!-- DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07090d;
            --bg2: #0b0f15;
            --panel: rgba(13, 18, 26, 0.88);
            --panel2: rgba(18, 24, 34, 0.94);

            --border: rgba(150, 220, 255, 0.10);
            --border2: rgba(150, 220, 255, 0.18);

            --cyan: #7de7ff;
            --cyan2: #46cfff;

            --text: #f0f5f8;
            --muted: #7e8a95;

            --danger: #ff5364;

            --radius: 18px;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(circle at 70% 15%, rgba(60, 190, 255, 0.055), transparent 30%),
                radial-gradient(circle at 20% 80%, rgba(80, 150, 255, 0.035), transparent 30%),
                var(--bg);

            color: var(--text);

            font-family: "Inter", sans-serif;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* ================================
           APP
        ================================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* ================================
           SIDEBAR
        ================================= */

        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100%;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    rgba(12, 17, 24, 0.97),
                    rgba(7, 10, 15, 0.97)
                );

            border-right: 1px solid var(--border);
        }

        .brand {
            padding: 24px 22px 20px;

            display: flex;
            align-items: center;
            gap: 12px;

            border-bottom: 1px solid var(--border);
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(125, 231, 255, .35);
            border-radius: 12px;

            color: var(--cyan);

            font-family: "Orbitron", sans-serif;
            font-size: 15px;

            box-shadow:
                0 0 20px rgba(70, 207, 255, .08);
        }

        .brand-name {
            font-family: "Orbitron", sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .new-chat {
            margin: 16px;

            padding: 12px 14px;

            border: 1px solid var(--border2);
            border-radius: 13px;

            background: rgba(125, 231, 255, .04);
            color: var(--text);

            display: flex;
            align-items: center;
            gap: 10px;

            transition: .2s;
        }

        .new-chat:hover {
            background: rgba(125, 231, 255, .09);
            border-color: rgba(125, 231, 255, .28);
        }

        .new-chat span:first-child {
            color: var(--cyan);
            font-size: 20px;
        }

        .conversation-title {
            padding: 0 18px 8px;

            font-family: "Space Grotesk", sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: var(--muted);
        }

        .conversations {
            flex: 1;
            overflow-y: auto;
            padding: 0 9px 15px;
        }

        .conversation {
            position: relative;

            display: flex;
            align-items: center;

            width: 100%;
            min-height: 46px;

            margin-bottom: 5px;
            padding: 0 11px;

            border-radius: 11px;

            color: #aab4bd;

            cursor: pointer;

            transition: .18s;
        }

        .conversation:hover {
            background: rgba(255,255,255,.035);
            color: white;
        }

        .conversation.active {
            background: rgba(125,231,255,.07);
            color: white;
        }

        .conversation-name {
            flex: 1;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 13px;
        }

        .conversation-menu {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background: transparent;
            color: #66727c;

            opacity: 0;

            transition: .15s;
        }

        .conversation:hover .conversation-menu,
        .conversation.active .conversation-menu {
            opacity: 1;
        }

        .conversation-menu:hover {
            color: white;
            background: rgba(255,255,255,.06);
        }

        /* ================================
           MAIN
        ================================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        .topbar {
            height: 68px;
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            border-bottom: 1px solid var(--border);

            background: rgba(7,10,15,.62);
            backdrop-filter: blur(16px);
        }

        .topbar-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 11px;
            color: var(--muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--cyan);

            box-shadow: 0 0 12px var(--cyan);
        }

        /* ================================
           CHAT
        ================================= */

        .chat {
            flex: 1;
            overflow-y: auto;

            padding: 30px 20px 150px;
        }

        .messages {
            width: min(900px, 100%);
            margin: auto;
        }

        .welcome {
            min-height: calc(100vh - 250px);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;
        }

        .welcome-logo {
            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 24px;

            border: 1px solid rgba(125,231,255,.3);
            border-radius: 24px;

            color: var(--cyan);

            font-family: "Orbitron", sans-serif;
            font-size: 24px;

            box-shadow:
                0 0 40px rgba(70,207,255,.08);
        }

        .welcome h1 {
            margin-bottom: 9px;

            font-family: "Orbitron", sans-serif;
            font-size: clamp(25px, 4vw, 38px);
            letter-spacing: 2px;
        }

        .welcome p {
            max-width: 500px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .message {
            display: flex;
            gap: 13px;

            margin-bottom: 26px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 34px;
            min-width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            font-family: "Orbitron", sans-serif;
            font-size: 10px;
        }

        .assistant .avatar {
            border: 1px solid rgba(125,231,255,.25);
            color: var(--cyan);
            background: rgba(125,231,255,.035);
        }

        .user .avatar {
            order: 2;

            background: rgba(255,255,255,.07);
            color: #dce3e8;
        }

        .bubble {
            max-width: min(720px, 82%);

            padding: 13px 16px;

            border-radius: 15px;

            font-size: 14px;
            line-height: 1.65;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .assistant .bubble {
            background: rgba(17,23,32,.72);
            border: 1px solid var(--border);
        }

        .user .bubble {
            background: rgba(125,231,255,.07);
            border: 1px solid rgba(125,231,255,.11);
        }

        .message-image {
            max-width: 450px;
            max-height: 400px;

            display: block;

            margin-top: 10px;

            border-radius: 13px;

            border: 1px solid var(--border);
        }

        .typing {
            color: var(--muted);
            font-size: 13px;
        }

        /* ================================
           INPUT
        ================================= */

        .input-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 18px 20px 22px;

            background:
                linear-gradient(
                    to top,
                    rgba(7,9,13,1) 40%,
                    rgba(7,9,13,.9),
                    transparent
                );
        }

        .input-wrap {
            width: min(900px, 100%);
            margin: auto;

            border: 1px solid var(--border2);
            border-radius: 17px;

            background: rgba(13,18,26,.94);

            box-shadow:
                0 15px 50px rgba(0,0,0,.28);

            backdrop-filter: blur(15px);
        }

        .file-preview {
            display: none;

            align-items: center;
            gap: 10px;

            padding: 10px 13px;

            border-bottom: 1px solid var(--border);

            color: #bac5cc;
            font-size: 12px;
        }

        .file-preview.visible {
            display: flex;
        }

        .file-preview-name {
            flex: 1;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .remove-file {
            color: #7c8790;
            background: transparent;

            font-size: 18px;
        }

        .remove-file:hover {
            color: var(--danger);
        }

        .input-row {
            display: flex;
            align-items: flex-end;

            padding: 10px;
            gap: 7px;
        }

        .icon-btn {
            width: 39px;
            height: 39px;

            min-width: 39px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: transparent;
            color: #84909a;

            font-size: 20px;

            transition: .18s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,.055);
            color: var(--cyan);
        }

        .icon-btn.listening {
            color: #ff6978;
            background: rgba(255,83,100,.08);

            animation: pulseMic 1.1s infinite;
        }

        @keyframes pulseMic {
            50% {
                box-shadow: 0 0 0 6px rgba(255,83,100,.04);
            }
        }

        textarea {
            flex: 1;

            min-height: 39px;
            max-height: 160px;

            resize: none;

            padding: 9px 4px;

            background: transparent;
            border: none;
            outline: none;

            color: var(--text);

            font-size: 14px;
            line-height: 1.45;
        }

        textarea::placeholder {
            color: #59656f;
        }

        .send-btn {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(125,231,255,.1);
            color: var(--cyan);

            font-size: 18px;

            transition: .18s;
        }

        .send-btn:hover {
            background: rgba(125,231,255,.17);
            box-shadow: 0 0 20px rgba(70,207,255,.08);
        }

        .send-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ================================
           SCROLLBAR
        ================================= */

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.08);
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,.13);
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 750px) {

            .sidebar {
                width: 225px;
                min-width: 225px;
            }

            .bubble {
                max-width: 86%;
            }

            .topbar {
                padding: 0 15px;
            }

            .chat {
                padding-left: 12px;
                padding-right: 12px;
            }

            .input-area {
                padding-left: 10px;
                padding-right: 10px;
            }
        }

        @media (max-width: 560px) {

            .sidebar {
                display: none;
            }

            .bubble {
                max-width: 90%;
            }

            .welcome-logo {
                width: 64px;
                height: 64px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- ================================
         SIDEBAR
    ================================= -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">A</div>
            <div class="brand-name">ALICIA</div>
        </div>

        <button class="new-chat" id="newChat">
            <span>＋</span>
            <span>Nueva conversación</span>
        </button>

        <div class="conversation-title">
            Conversaciones
        </div>

        <div class="conversations" id="conversations"></div>

    </aside>


    <!-- ================================
         MAIN
    ================================= -->

    <main class="main">

        <header class="topbar">

            <div class="topbar-title" id="topbarTitle">
                Alicia
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">conectada</span>
            </div>

        </header>


        <section class="chat" id="chat">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>Alicia</h1>

                    <p>
                        Una conversación que no tiene por qué sentirse como
                        una conversación con un chatbot.
                    </p>

                </div>

            </div>

        </section>


        <!-- ================================
             INPUT
        ================================= -->

        <div class="input-area">

            <div class="input-wrap">

                <div class="file-preview" id="filePreview">

                    <span>📎</span>

                    <span class="file-preview-name"
                          id="filePreviewName">
                    </span>

                    <button class="remove-file"
                            id="removeFile"
                            title="Quitar archivo">
                        ×
                    </button>

                </div>


                <div class="input-row">

                    <button
                        class="icon-btn"
                        id="attachBtn"
                        title="Adjuntar archivo">
                        +
                    </button>


                    <input
                        type="file"
                        id="fileInput"
                        accept="
                            image/*,
                            .pdf,
                            .doc,
                            .docx,
                            .txt,
                            .md,
                            .csv,
                            .json,
                            .html
                        "
                        hidden
                    >


                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Hablá con Alicia..."
                        autocomplete="off">
                    </textarea>


                    <button
                        class="icon-btn"
                        id="micBtn"
                        title="Hablar">
                        🎙
                    </button>


                    <button
                        class="send-btn"
                        id="sendBtn"
                        title="Enviar">
                        ↑
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>


<script type="module">

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


/* ============================================================
   ESTADO
============================================================ */

let conversations = [];

let activeConversationId = null;

let selectedFile = null;

let selectedFileText = null;

let recognition = null;

let isListening = false;


/* ============================================================
   ELEMENTOS
============================================================ */

const conversationsElement =
    document.getElementById("conversations");

const messagesElement =
    document.getElementById("messages");

const welcomeElement =
    document.getElementById("welcome");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const attachBtn =
    document.getElementById("attachBtn");

const fileInput =
    document.getElementById("fileInput");

const filePreview =
    document.getElementById("filePreview");

const filePreviewName =
    document.getElementById("filePreviewName");

const removeFile =
    document.getElementById("removeFile");

const newChatBtn =
    document.getElementById("newChat");

const topbarTitle =
    document.getElementById("topbarTitle");

const statusText =
    document.getElementById("statusText");

const chatElement =
    document.getElementById("chat");


/* ============================================================
   STORAGE
============================================================ */

const STORAGE_KEY =
    "alicia_conversations_v4";


function saveConversations() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(conversations)
    );
}


function loadConversations() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {

            createConversation();

            return;
        }

        conversations =
            JSON.parse(saved);

        if (
            !Array.isArray(conversations) ||
            conversations.length === 0
        ) {

            createConversation();

            return;
        }

        activeConversationId =
            conversations[0].id;

        renderConversations();

        renderActiveConversation();

    } catch (error) {

        console.error(error);

        conversations = [];

        createConversation();
    }
}


/* ============================================================
   CONVERSACIONES
============================================================ */

function createConversation() {

    const conversation = {

        id:
            "chat_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8),

        title: "Nueva conversación",

        messages: [],

        createdAt: Date.now(),

        updatedAt: Date.now()

    };


    conversations.unshift(conversation);

    activeConversationId =
        conversation.id;

    saveConversations();

    renderConversations();

    renderActiveConversation();
}


function getActiveConversation() {

    return conversations.find(
        c => c.id === activeConversationId
    );
}


function switchConversation(id) {

    activeConversationId = id;

    clearSelectedFile();

    renderConversations();

    renderActiveConversation();
}


function renameConversation(id) {

    const conversation =
        conversations.find(
            c => c.id === id
        );

    if (!conversation) return;


    const newName =
        prompt(
            "Nombre de la conversación:",
            conversation.title
        );


    if (
        newName === null ||
        !newName.trim()
    ) {
        return;
    }


    conversation.title =
        newName.trim();

    conversation.updatedAt =
        Date.now();

    saveConversations();

    renderConversations();

    renderActiveConversation();
}


function deleteConversation(id) {

    const index =
        conversations.findIndex(
            c => c.id === id
        );

    if (index === -1) return;


    const confirmed =
        confirm(
            "¿Eliminar esta conversación?"
        );


    if (!confirmed) return;


    conversations.splice(index, 1);


    if (conversations.length === 0) {

        createConversation();

        return;
    }


    if (activeConversationId === id) {

        activeConversationId =
            conversations[0].id;
    }


    saveConversations();

    renderConversations();

    renderActiveConversation();
}


/* ============================================================
   SIDEBAR
============================================================ */

function renderConversations() {

    conversationsElement.innerHTML = "";


    for (const conversation of conversations) {

        const item =
            document.createElement("div");

        item.className =
            "conversation" +
            (
                conversation.id ===
                activeConversationId
                    ? " active"
                    : ""
            );


        const name =
            document.createElement("div");

        name.className =
            "conversation-name";

        name.textContent =
            conversation.title;


        const menu =
            document.createElement("button");

        menu.className =
            "conversation-menu";

        menu.textContent =
            "⋯";

        menu.title =
            "Opciones";


        menu.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                showConversationMenu(
                    conversation.id
                );
            }
        );


        item.addEventListener(
            "click",
            () => {

                switchConversation(
                    conversation.id
                );
            }
        );


        item.appendChild(name);

        item.appendChild(menu);

        conversationsElement.appendChild(item);
    }
}


function showConversationMenu(id) {

    const conversation =
        conversations.find(
            c => c.id === id
        );

    if (!conversation) return;


    const action =
        prompt(
            "Escribí una opción:\n\n" +
            "renombrar\n" +
            "eliminar"
        );


    if (!action) return;


    const normalized =
        action
            .trim()
            .toLowerCase();


    if (
        normalized === "renombrar" ||
        normalized === "r"
    ) {

        renameConversation(id);

    } else if (
        normalized === "eliminar" ||
        normalized === "e"
    ) {

        deleteConversation(id);
    }
}


/* ============================================================
   RENDER MENSAJES
============================================================ */

function renderActiveConversation() {

    const conversation =
        getActiveConversation();


    if (!conversation) return;


    topbarTitle.textContent =
        conversation.title;


    messagesElement.innerHTML = "";


    if (
        !conversation.messages ||
        conversation.messages.length === 0
    ) {

        messagesElement.appendChild(
            createWelcome()
        );

        return;
    }


    for (
        const message of conversation.messages
    ) {

        renderMessage(
            message.role,
            message.content,
            message.image || null
        );
    }


    scrollToBottom();
}


function createWelcome() {

    const welcome =
        document.createElement("div");

    welcome.className =
        "welcome";


    welcome.innerHTML = `

        <div class="welcome-logo">
            A
        </div>

        <h1>Alicia</h1>

        <p>
            Una conversación que no tiene por qué sentirse
            como una conversación con un chatbot.
        </p>

    `;


    return welcome;
}


/* ============================================================
   MOSTRAR MENSAJE
============================================================ */

function renderMessage(
    role,
    content,
    image = null
) {

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "TÚ"
            : "A";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    if (content) {

        const text =
            document.createElement("div");

        text.textContent =
            content;

        bubble.appendChild(text);
    }


    if (image) {

        const img =
            document.createElement("img");

        img.src =
            image;

        img.className =
            "message-image";

        img.alt =
            "Imagen enviada a Alicia";

        bubble.appendChild(img);
    }


    if (role === "user") {

        message.appendChild(bubble);

        message.appendChild(avatar);

    } else {

        message.appendChild(avatar);

        message.appendChild(bubble);
    }


    messagesElement.appendChild(
        message
    );
}


/* ============================================================
   ENVIAR MENSAJE
============================================================ */

async function sendMessage() {

    const rawText =
        messageInput.value.trim();


    if (
        !rawText &&
        !selectedFileText &&
        !selectedFile
    ) {
        return;
    }


    const conversation =
        getActiveConversation();


    if (!conversation) return;


    let finalText =
        rawText;


    let imageToSend =
        null;


    /*
     * IMAGEN
     */

    if (
        selectedFile &&
        selectedFile.type.startsWith("image/")
    ) {

        imageToSend =
            await fileToDataURL(
                selectedFile
            );
    }


    /*
     * ARCHIVO DE TEXTO
     */

    if (
        selectedFileText
    ) {

        finalText +=
            (
                finalText
                    ? "\n\n"
                    : ""
            ) +

            `[ARCHIVO ADJUNTO: ${selectedFile.name}]\n` +

            selectedFileText +

            `\n[FIN DEL ARCHIVO]`;
    }


    /*
     * MENSAJE VISUAL
     */

    renderMessage(
        "user",
        finalText,
        imageToSend
    );


    /*
     * GUARDAR HISTORIAL
     */

    conversation.messages.push({

        role: "user",

        content: finalText,

        image:
            imageToSend,

        timestamp:
            Date.now()

    });


    if (
        conversation.messages.length === 1
    ) {

        conversation.title =
            createConversationTitle(
                rawText ||
                selectedFile?.name ||
                "Nueva conversación"
            );
    }


    conversation.updatedAt =
        Date.now();


    saveConversations();

    renderConversations();

    messageInput.value = "";

    autoResizeTextarea();

    clearSelectedFile();

    scrollToBottom();


    /*
     * INDICADOR
     */

    const typing =
        document.createElement("div");

    typing.className =
        "message assistant";

    typing.id =
        "typingMessage";


    typing.innerHTML = `

        <div class="avatar">
            A
        </div>

        <div class="bubble typing">
            Alicia está pensando...
        </div>

    `;


    messagesElement.appendChild(
        typing
    );

    scrollToBottom();


    sendBtn.disabled = true;

    statusText.textContent =
        "pensando";


    try {

        /*
         * IMPORTANTE:
         * No enviamos el mensaje del usuario
         * dos veces en history.
         *
         * history contiene los mensajes anteriores
         * y message contiene el mensaje actual.
         */

        const history =
            conversation.messages
                .slice(0, -1)
                .map(message => {

                    if (
                        message.image &&
                        message.role === "user"
                    ) {

                        return {

                            role: "user",

                            content: [

                                {
                                    type: "text",
                                    text:
                                        message.content
                                },

                                {
                                    type: "image_url",

                                    image_url: {
                                        url:
                                            message.image
                                    }
                                }

                            ]
                        };
                    }


                    return {

                        role:
                            message.role,

                        content:
                            message.content
                    };
                });


        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                finalText,

                            image:
                                imageToSend,

                            history:
                                history

                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error ||
                `Error HTTP ${response.status}`
            );
        }


        /*
         * EL WORKER DEVUELVE:
         *
         * {
         *   ok: true,
         *   response: "..."
         * }
         */

        const aiResponse =
            data?.response;


        if (
            typeof aiResponse !== "string" ||
            !aiResponse.trim()
        ) {

            throw new Error(
                "El Worker no devolvió el campo 'response'."
            );
        }


        removeTyping();


        conversation.messages.push({

            role: "assistant",

            content:
                aiResponse,

            timestamp:
                Date.now()

        });


        conversation.updatedAt =
            Date.now();


        saveConversations();


        renderMessage(
            "assistant",
            aiResponse
        );


        scrollToBottom();


        statusText.textContent =
            "conectada";


    } catch (error) {

        console.error(
            "ALICIA:",
            error
        );


        removeTyping();


        const errorText =
            "No pude conectarme con mi cerebro ahora mismo.\n\n" +
            "Detalle: " +
            error.message;


        renderMessage(
            "assistant",
            errorText
        );


        statusText.textContent =
            "error de conexión";


    } finally {

        sendBtn.disabled =
            false;

        messageInput.focus();
    }
}


/* ============================================================
   TÍTULO AUTOMÁTICO
============================================================ */

function createConversationTitle(text) {

    const clean =
        text
            .replace(
                /\[ARCHIVO ADJUNTO:[^\]]+\]/gi,
                ""
            )
            .trim();


    if (!clean) {

        return "Nueva conversación";
    }


    if (
        clean.length <= 32
    ) {

        return clean;
    }


    return (
        clean.substring(0, 32)
        .trim() +
        "..."
    );
}

/* ============================================================
   EXTRAER ARCHIVOS
============================================================ */

async function extractFileText(file) {

    const name =
        file.name.toLowerCase();


    /*
     * TXT / MD / CSV / JSON / HTML
     */

    if (
        file.type.startsWith("text/") ||
        name.endsWith(".txt") ||
        name.endsWith(".md") ||
        name.endsWith(".csv") ||
        name.endsWith(".json") ||
        name.endsWith(".html")
    ) {

        return await file.text();
    }


    /*
     * DOCX
     */

    if (
        name.endsWith(".docx")
    ) {

        if (
            typeof mammoth ===
            "undefined"
        ) {

            throw new Error(
                "Mammoth no está disponible."
            );
        }


        const arrayBuffer =
            await file.arrayBuffer();


        const result =
            await mammoth.extractRawText({
                arrayBuffer
            });


        return result.value;
    }


    /*
     * DOC ANTIGUO
     */

    if (
        name.endsWith(".doc")
    ) {

        return (
            "El archivo .doc antiguo no puede ser leído directamente por el navegador. " +
            "Convertí el archivo a .docx o PDF para que Alicia pueda analizarlo."
        );
    }


    /*
     * PDF
     */

    if (
        name.endsWith(".pdf") ||
        file.type === "application/pdf"
    ) {

        return await extractPDF(file);
    }


    return (
        "Tipo de archivo no compatible para extracción de texto."
    );
}


/* ============================================================
   PDF
============================================================ */

async function extractPDF(file) {

    const arrayBuffer =
        await file.arrayBuffer();


    const pdfjs =
        await import(
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        );


    pdfjs.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    const pdf =
        await pdfjs.getDocument({
            data: arrayBuffer
        }).promise;


    let text =
        "";


    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {

        const page =
            await pdf.getPage(
                pageNumber
            );


        const content =
            await page.getTextContent();


        const pageText =
            content.items
                .map(item => item.str)
                .join(" ");


        text +=
            `\n\n--- Página ${pageNumber} ---\n\n` +
            pageText;
    }


    return text.trim();
}


/* ============================================================
   FILE → DATA URL
============================================================ */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );
        }
    );
}


/* ============================================================
   TAMAÑO ARCHIVO
============================================================ */

function formatFileSize(bytes) {

    if (bytes < 1024) {

        return bytes + " B";
    }


    if (bytes < 1024 * 1024) {

        return (
            (bytes / 1024)
                .toFixed(1) +
            " KB"
        );
    }


    return (
        (bytes / (1024 * 1024))
            .toFixed(1) +
        " MB"
    );
}


/* ============================================================
   MICROFONO
============================================================ */

function setupSpeechRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        micBtn.title =
            "Tu navegador no admite reconocimiento de voz";

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "es-AR";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.onstart =
        () => {

            isListening =
                true;

            micBtn.classList.add(
                "listening"
            );

            micBtn.title =
                "Detener micrófono";

            statusText.textContent =
                "escuchando";
        };


    recognition.onresult =
        event => {

            let transcript =
                "";


            for (
                let i =
                    event.resultIndex;

                i < event.results.length;

                i++
            ) {

                transcript +=
                    event.results[i][0].transcript;
            }


            const existing =
                messageInput.value.trim();


            if (existing) {

                messageInput.value =
                    existing +
                    " " +
                    transcript;

            } else {

                messageInput.value =
                    transcript;
            }


            autoResizeTextarea();
        };


    recognition.onerror =
        event => {

            console.error(
                "Speech Recognition:",
                event.error
            );
        };


    recognition.onend =
        () => {

            isListening =
                false;

            micBtn.classList.remove(
                "listening"
            );

            micBtn.title =
                "Hablar";

            statusText.textContent =
                "conectada";
        };
}


micBtn.addEventListener(
    "click",
    () => {

        if (!recognition) {

            alert(
                "Tu navegador no admite reconocimiento de voz."
            );

            return;
        }


        if (isListening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                console.error(error);
            }
        }
    }
);

/* ============================================================
   INICIATIVA DE ALICIA
============================================================ */

async function checkAliciaInitiative() {

    const conversation =
        getActiveConversation();


    if (!conversation) return;


    if (
        !conversation.messages ||
        conversation.messages.length === 0
    ) {

        return;
    }


    /*
     * No hacemos una iniciativa
     * inmediatamente después de responder.
     */

    const history =
        conversation.messages.map(
            message => {

                if (
                    message.image &&
                    message.role === "user"
                ) {

                    return {

                        role:
                            "user",

                        content: [

                            {
                                type: "text",
                                text:
                                    message.content
                            },

                            {
                                type: "image_url",

                                image_url: {
                                    url:
                                        message.image
                                }
                            }

                        ]
                    };
                }


                return {

                    role:
                        message.role,

                    content:
                        message.content
                };
            }
        );


    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            initiative:
                                true,

                            history:
                                history

                        })
                }
            );


        if (!response.ok) {

            return;
        }


        const data =
            await response.json();


        const initiative =
            data?.response?.trim();


        if (
            !initiative ||
            initiative ===
                "NO_INITIATIVE"
        ) {

            return;
        }


        /*
         * Evitamos duplicados.
         */

        const last =
            conversation.messages[
                conversation.messages.length - 1
            ];


        if (
            last &&
            last.role === "assistant" &&
            last.content === initiative
        ) {

            return;
        }


        conversation.messages.push({

            role:
                "assistant",

            content:
                initiative,

            timestamp:
                Date.now()
        });


        conversation.updatedAt =
            Date.now();


        saveConversations();


        renderMessage(
            "assistant",
            initiative
        );


        scrollToBottom();

    } catch (error) {

        console.error(
            "Initiative error:",
            error
        );
    }
}
