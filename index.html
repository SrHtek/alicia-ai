<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alicia AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #05070a;
    --bg2: #080c11;
    --panel: rgba(10, 15, 22, .82);
    --panel2: rgba(14, 20, 29, .9);

    --cyan: #5ee7ff;
    --cyan2: #1fb8ff;
    --cyan3: #8df1ff;

    --text: #e8f7ff;
    --muted: #70818e;
    --border: rgba(94, 231, 255, .13);

    --user: rgba(25, 45, 58, .75);
    --ai: rgba(8, 15, 22, .92);

    --shadow:
        0 0 35px rgba(31, 184, 255, .08),
        inset 0 0 30px rgba(94, 231, 255, .015);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background:
        radial-gradient(circle at 70% 15%, rgba(31,184,255,.07), transparent 25%),
        radial-gradient(circle at 20% 80%, rgba(94,231,255,.035), transparent 25%),
        var(--bg);

    color: var(--text);
    font-family: Inter, sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.background-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .22;

    background-image:
        linear-gradient(rgba(94,231,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94,231,255,.025) 1px, transparent 1px);

    background-size: 55px 55px;

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}

.scanline {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.008) 4px
        );
}

/* =========================
   APP
========================= */

.app {
    position: relative;
    display: flex;
    width: 100%;
    height: 100%;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: relative;
    width: 290px;
    height: 100%;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            rgba(7,12,18,.96),
            rgba(4,7,11,.98)
        );

    border-right: 1px solid var(--border);

    backdrop-filter: blur(25px);

    z-index: 20;
}

.brand {
    height: 92px;

    display: flex;
    align-items: center;
    gap: 14px;

    padding: 0 24px;

    border-bottom: 1px solid rgba(94,231,255,.08);
}

.logo {
    width: 43px;
    height: 43px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(94,231,255,.5);
    border-radius: 12px;

    color: var(--cyan);

    font-family: Orbitron, sans-serif;
    font-size: 17px;

    box-shadow:
        0 0 20px rgba(94,231,255,.14),
        inset 0 0 14px rgba(94,231,255,.06);

    position: relative;
}

.logo::after {
    content: "";
    position: absolute;
    inset: -5px;

    border: 1px solid rgba(94,231,255,.08);
    border-radius: 15px;
}

.brand-name {
    font-family: Orbitron, sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
}

.brand-sub {
    margin-top: 4px;

    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
}

/* =========================
   NEW CHAT
========================= */

.new-chat {
    margin: 20px;

    height: 48px;

    border: 1px solid rgba(94,231,255,.24);
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.08),
            rgba(94,231,255,.02)
        );

    color: var(--cyan3);

    font-family: Inter, sans-serif;
    font-weight: 600;

    cursor: pointer;

    transition: .25s;
}

.new-chat:hover {
    border-color: rgba(94,231,255,.55);

    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.15),
            rgba(94,231,255,.04)
        );

    box-shadow:
        0 0 25px rgba(94,231,255,.08);

    transform: translateY(-1px);
}

/* =========================
   CONVERSATIONS
========================= */

.section-title {
    padding: 4px 22px 12px;

    color: #50616d;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 2px;
}

.conversations {
    flex: 1;
    overflow-y: auto;

    padding: 0 10px 20px;
}

.conversations::-webkit-scrollbar,
.messages::-webkit-scrollbar {
    width: 5px;
}

.conversations::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb {
    background: rgba(94,231,255,.12);
    border-radius: 10px;
}

.conversation {
    position: relative;

    display: flex;
    align-items: center;

    min-height: 48px;

    padding: 0 13px;
    margin-bottom: 4px;

    border-radius: 8px;

    color: #7f929f;

    cursor: pointer;

    transition: .2s;
}

.conversation:hover {
    background: rgba(94,231,255,.045);
    color: #cceef7;
}

.conversation.active {
    background:
        linear-gradient(
            90deg,
            rgba(94,231,255,.11),
            rgba(94,231,255,.025)
        );

    color: var(--cyan3);

    border-left: 2px solid var(--cyan);
}

.conversation-name {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 13px;
}

.conversation-actions {
    margin-left: auto;

    display: flex;
    gap: 3px;

    opacity: 0;
}

.conversation:hover .conversation-actions {
    opacity: 1;
}

.small-action {
    width: 25px;
    height: 25px;

    border: 0;
    border-radius: 6px;

    background: rgba(255,255,255,.04);
    color: #80929e;

    cursor: pointer;
}

.small-action:hover {
    color: white;
    background: rgba(255,255,255,.09);
}

/* =========================
   STATUS
========================= */

.system-status {
    padding: 17px 21px;

    border-top: 1px solid rgba(94,231,255,.07);

    display: flex;
    align-items: center;
    gap: 9px;

    color: #657984;

    font-size: 10px;
    letter-spacing: 1px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #3fffb0;

    box-shadow:
        0 0 8px #3fffb0;

    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}

/* =========================
   MAIN
========================= */

.main {
    position: relative;

    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid rgba(94,231,255,.07);

    background: rgba(5,8,12,.6);

    backdrop-filter: blur(20px);

    z-index: 10;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.core {
    position: relative;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 8px var(--cyan),
        0 0 22px rgba(94,231,255,.55);
}

.core::before,
.core::after {
    content: "";

    position: absolute;

    inset: -7px;

    border: 1px solid rgba(94,231,255,.25);
    border-radius: 50%;

    animation: orbit 3s linear infinite;
}

.core::after {
    inset: -12px;

    opacity: .35;

    animation-duration: 5s;
}

@keyframes orbit {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.header-title {
    font-family: Orbitron, sans-serif;

    font-size: 14px;
    letter-spacing: 2px;
}

.header-state {
    margin-top: 4px;

    font-size: 9px;
    color: #5d7480;

    letter-spacing: 1.5px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;

    color: #5e727e;

    font-size: 10px;
    letter-spacing: 1px;
}

/* =========================
   CHAT
========================= */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 35px clamp(20px, 7vw, 100px) 30px;

    scroll-behavior: smooth;
}

.message {
    display: flex;

    width: 100%;

    margin-bottom: 27px;

    animation: messageIn .25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.message-content {
    max-width: min(760px, 80%);

    padding: 16px 19px;

    line-height: 1.65;

    font-size: 14px;

    border: 1px solid rgba(94,231,255,.07);

    border-radius: 14px;

    white-space: pre-wrap;

    box-shadow: var(--shadow);
}

.message.user .message-content {
    background:
        linear-gradient(
            135deg,
            rgba(28,52,67,.75),
            rgba(12,25,33,.85)
        );

    border-bottom-right-radius: 4px;
}

.message.assistant .message-content {
    background:
        linear-gradient(
            135deg,
            rgba(8,15,22,.9),
            rgba(7,12,18,.75)
        );

    border-left: 2px solid rgba(94,231,255,.45);

    border-bottom-left-radius: 4px;
}

.message-label {
    margin-bottom: 7px;

    color: #55717e;

    font-family: Orbitron, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.empty-inner {
    max-width: 580px;
}

.empty-orb {
    width: 110px;
    height: 110px;

    margin: 0 auto 30px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(94,231,255,.25);

    border-radius: 50%;

    box-shadow:
        0 0 35px rgba(94,231,255,.06),
        inset 0 0 35px rgba(94,231,255,.05);

    position: relative;

    animation: floating 4s ease-in-out infinite;
}

.empty-orb::before,
.empty-orb::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    border: 1px solid rgba(94,231,255,.16);
}

.empty-orb::before {
    inset: -13px;
}

.empty-orb::after {
    inset: 13px;
}

.orb-letter {
    font-family: Orbitron, sans-serif;

    font-size: 35px;

    color: var(--cyan);

    text-shadow:
        0 0 25px rgba(94,231,255,.55);
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

.empty h1 {
    margin: 0;

    font-family: Orbitron, sans-serif;

    font-size: 27px;
    font-weight: 500;

    letter-spacing: 4px;
}

.empty p {
    margin-top: 14px;

    color: #647985;

    font-size: 13px;

    line-height: 1.7;
}

/* =========================
   INPUT AREA
========================= */

.input-area {
    padding: 15px clamp(20px, 7vw, 100px) 22px;

    background:
        linear-gradient(
            to top,
            rgba(5,7,10,.98),
            rgba(5,7,10,.75)
        );

    border-top: 1px solid rgba(94,231,255,.06);
}

.input-shell {
    position: relative;

    display: flex;
    align-items: flex-end;

    gap: 9px;

    max-width: 950px;

    margin: auto;

    padding: 9px;

    border: 1px solid rgba(94,231,255,.14);

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(12,19,27,.94),
            rgba(6,10,15,.96)
        );

    box-shadow:
        0 0 35px rgba(94,231,255,.035),
        inset 0 0 25px rgba(94,231,255,.015);

    transition: .25s;
}

.input-shell:focus-within {
    border-color: rgba(94,231,255,.38);

    box-shadow:
        0 0 35px rgba(94,231,255,.08),
        inset 0 0 20px rgba(94,231,255,.025);
}

textarea {
    flex: 1;

    min-height: 44px;
    max-height: 180px;

    resize: none;

    padding: 12px 10px;

    border: 0;
    outline: 0;

    background: transparent;

    color: #e8f7ff;

    font-family: Inter, sans-serif;

    font-size: 14px;

    line-height: 1.5;
}

textarea::placeholder {
    color: #536773;
}

.input-button {
    flex-shrink: 0;

    width: 42px;
    height: 42px;

    border: 1px solid rgba(94,231,255,.16);

    border-radius: 10px;

    background: rgba(94,231,255,.045);

    color: #75909d;

    cursor: pointer;

    transition: .2s;

    font-size: 16px;
}

.input-button:hover {
    color: var(--cyan);
    border-color: rgba(94,231,255,.4);

    background: rgba(94,231,255,.1);
}

.send-button {
    background:
        linear-gradient(
            135deg,
            rgba(94,231,255,.18),
            rgba(31,184,255,.08)
        );

    color: var(--cyan3);

    border-color: rgba(94,231,255,.3);
}

.send-button:hover {
    box-shadow:
        0 0 20px rgba(94,231,255,.15);
}

.file-preview {
    display: none;

    max-width: 950px;

    margin: 0 auto 8px;

    padding: 8px 13px;

    border: 1px solid rgba(94,231,255,.1);

    border-radius: 8px;

    color: #77919d;

    font-size: 11px;
}

.footer-info {
    max-width: 950px;

    margin: 8px auto 0;

    text-align: center;

    color: #334852;

    font-size: 9px;

    letter-spacing: .5px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .sidebar {
        width: 230px;
    }

    .messages {
        padding-left: 20px;
        padding-right: 20px;
    }

    .input-area {
        padding-left: 15px;
        padding-right: 15px;
    }

    .header {
        padding: 0 18px;
    }

    .header-right {
        display: none;
    }
}

@media (max-width: 600px) {

    .sidebar {
        display: none;
    }

    .message-content {
        max-width: 92%;
    }
}
</style>
</head>

<body>

<div class="background-grid"></div>
<div class="scanline"></div>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="logo">A</div>

            <div>
                <div class="brand-name">ALICIA</div>
                <div class="brand-sub">AI SYSTEM</div>
            </div>

        </div>

        <button class="new-chat" id="newChat">
            + NUEVA CONVERSACIÓN
        </button>

        <div class="section-title">
            CONVERSACIONES
        </div>

        <div class="conversations" id="conversations"></div>

        <div class="system-status">
            <span class="status-dot"></span>
            SISTEMA ONLINE
        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <header class="header">

            <div class="header-left">

                <div class="core"></div>

                <div>
                    <div class="header-title">
                        ALICIA
                    </div>

                    <div class="header-state">
                        INTELLIGENCE CORE · ACTIVE
                    </div>
                </div>

            </div>

            <div class="header-right">
                <span id="connectionStatus">
                    GEMINI LINK
                </span>

                <span>
                    v1.0
                </span>
            </div>

        </header>


        <!-- =========================
             MESSAGES
        ========================== -->

        <section
            class="messages"
            id="messages"
        ></section>


        <!-- =========================
             INPUT
        ========================== -->

        <div class="input-area">

            <div
                class="file-preview"
                id="filePreview"
            ></div>

            <div class="input-shell">

                <button
                    class="input-button"
                    id="fileButton"
                    title="Adjuntar archivo"
                >
                    +
                </button>

                <input
                    type="file"
                    id="fileInput"
                    hidden
                    accept="image/*,.txt,.md,.json,.csv,.html,.pdf,.docx"
                >

                <button
                    class="input-button"
                    id="micButton"
                    title="Hablar"
                >
                    ◉
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Escribile a Alicia..."
                    rows="1"
                ></textarea>

                <button
                    class="input-button send-button"
                    id="sendButton"
                    title="Enviar"
                >
                    ➤
                </button>

            </div>

            <div class="footer-info">
                ALICIA · GEMINI CORE · CONVERSACIÓN PRIVADA
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER_URL =
    "https://alica-ai.hector-s-g-rivero.workers.dev/";


/* =========================================================
   ELEMENTOS
========================================================= */

const messagesEl =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChat");

const conversationsEl =
    document.getElementById("conversations");

const fileButton =
    document.getElementById("fileButton");

const fileInput =
    document.getElementById("fileInput");

const filePreview =
    document.getElementById("filePreview");

const micButton =
    document.getElementById("micButton");

const connectionStatus =
    document.getElementById("connectionStatus");


/* =========================================================
   ESTADO
========================================================= */

let conversations =
    JSON.parse(
        localStorage.getItem("alicia_conversations") || "[]"
    );

let activeConversationId =
    localStorage.getItem("alicia_active") || null;

let selectedFile = null;

let isSending = false;


/* =========================================================
   CREAR CONVERSACIÓN
========================================================= */

function createConversation() {

    const conversation = {
        id: Date.now().toString(),
        title: "Nueva conversación",
        messages: []
    };

    conversations.unshift(conversation);

    activeConversationId =
        conversation.id;

    saveState();

    renderConversations();

    renderMessages();
}


/* =========================================================
   ESTADO
========================================================= */

function saveState() {

    localStorage.setItem(
        "alicia_conversations",
        JSON.stringify(conversations)
    );

    localStorage.setItem(
        "alicia_active",
        activeConversationId || ""
    );
}


/* =========================================================
   CONVERSACIÓN ACTIVA
========================================================= */

function getActiveConversation() {

    return conversations.find(
        c => c.id === activeConversationId
    );
}


/* =========================================================
   RENDER SIDEBAR
========================================================= */

function renderConversations() {

    conversationsEl.innerHTML = "";

    for (const conversation of conversations) {

        const item =
            document.createElement("div");

        item.className =
            "conversation" +
            (
                conversation.id === activeConversationId
                    ? " active"
                    : ""
            );

        const name =
            document.createElement("span");

        name.className =
            "conversation-name";

        name.textContent =
            conversation.title;

        const actions =
            document.createElement("div");

        actions.className =
            "conversation-actions";

        const rename =
            document.createElement("button");

        rename.className =
            "small-action";

        rename.textContent =
            "✎";

        rename.onclick = event => {

            event.stopPropagation();

            const newName =
                prompt(
                    "Nombre de la conversación:",
                    conversation.title
                );

            if (
                newName &&
                newName.trim()
            ) {

                conversation.title =
                    newName.trim();

                saveState();

                renderConversations();
            }
        };

        const remove =
            document.createElement("button");

        remove.className =
            "small-action";

        remove.textContent =
            "×";

        remove.onclick = event => {

            event.stopPropagation();

            conversations =
                conversations.filter(
                    c =>
                        c.id !== conversation.id
                );

            if (
                activeConversationId ===
                conversation.id
            ) {

                activeConversationId =
                    conversations[0]?.id || null;
            }

            saveState();

            renderConversations();

            renderMessages();
        };

        actions.appendChild(rename);
        actions.appendChild(remove);

        item.appendChild(name);
        item.appendChild(actions);

        item.onclick = () => {

            activeConversationId =
                conversation.id;

            saveState();

            renderConversations();

            renderMessages();
        };

        conversationsEl.appendChild(item);
    }
}


/* =========================================================
   RENDER MENSAJES
========================================================= */

function renderMessages() {

    messagesEl.innerHTML = "";

    const conversation =
        getActiveConversation();

    if (
        !conversation ||
        conversation.messages.length === 0
    ) {

        messagesEl.innerHTML = `
            <div class="empty">

                <div class="empty-inner">

                    <div class="empty-orb">
                        <span class="orb-letter">A</span>
                    </div>

                    <h1>ALICIA</h1>

                    <p>
                        Sistema de inteligencia artificial
                        conectado.<br>
                        Podés hablar conmigo, preguntarme cosas,
                        mandarme imágenes o archivos.
                    </p>

                </div>

            </div>
        `;

        return;
    }

    for (
        const message
        of conversation.messages
    ) {

        addMessageToDOM(
            message.role,
            message.content
        );
    }

    scrollToBottom();
}


/* =========================================================
   AGREGAR MENSAJE
========================================================= */

function addMessageToDOM(
    role,
    content
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );

    const box =
        document.createElement("div");

    box.className =
        "message-content";

    const label =
        document.createElement("div");

    label.className =
        "message-label";

    label.textContent =
        role === "user"
            ? "YOU"
            : "ALICIA";

    const text =
        document.createElement("div");

    text.textContent =
        content;

    box.appendChild(label);
    box.appendChild(text);

    wrapper.appendChild(box);

    messagesEl.appendChild(wrapper);
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    });
}


/* =========================================================
   ENVIAR
========================================================= */

async function sendMessage() {

    if (isSending) {
        return;
    }

    const text =
        input.value.trim();

    if (
        !text &&
        !selectedFile
    ) {
        return;
    }

    let conversation =
        getActiveConversation();

    if (!conversation) {

        createConversation();

        conversation =
            getActiveConversation();
    }

    isSending = true;

    sendButton.disabled = true;

    connectionStatus.textContent =
        "CONNECTING...";


    /* =========================
       ARCHIVO
    ========================= */

    let imageData = null;

    if (selectedFile) {

        if (
            selectedFile.type.startsWith(
                "image/"
            )
        ) {

            imageData =
                await fileToDataURL(
                    selectedFile
                );
        }
    }


    /* =========================
       MENSAJE
    ========================= */

    let finalText = text;

    if (
        selectedFile &&
        !selectedFile.type.startsWith("image/")
    ) {

        finalText +=
            "\n\n[Archivo adjunto: " +
            selectedFile.name +
            "]";
    }

    if (!finalText.trim()) {
        finalText =
            "Analizá esta imagen.";
    }


    conversation.messages.push({
        role: "user",
        content: finalText
    });


    if (
        conversation.title ===
        "Nueva conversación"
    ) {

        conversation.title =
            finalText
                .slice(0, 35)
                .trim() +
            (
                finalText.length > 35
                    ? "..."
                    : ""
            );
    }

    saveState();

    renderConversations();

    renderMessages();

    input.value = "";

    autoResize();


    /* =========================
       HISTORIAL
    ========================= */

    const history =
        conversation.messages
            .slice(0, -1)
            .slice(-30);


    try {

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                finalText,

                            image:
                                imageData,

                            history:
                                history
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Error de conexión."
            );
        }


        const answer =
            data.response ||
            "No recibí una respuesta.";


        conversation.messages.push({
            role: "assistant",
            content: answer
        });

        saveState();

        renderMessages();

        connectionStatus.textContent =
            "GEMINI LINK · ONLINE";


    } catch (error) {

        console.error(error);

        conversation.messages.push({
            role: "assistant",
            content:
                "No pude conectarme con mi cerebro ahora mismo.\n\nDetalle: " +
                error.message
        });

        saveState();

        renderMessages();

        connectionStatus.textContent =
            "CONNECTION ERROR";
    }


    selectedFile = null;

    fileInput.value = "";

    filePreview.style.display =
        "none";

    filePreview.textContent = "";

    isSending = false;

    sendButton.disabled = false;
}


/* =========================================================
   ARCHIVOS
========================================================= */

fileButton.onclick = () => {

    fileInput.click();

};

fileInput.onchange = () => {

    const file =
        fileInput.files?.[0];

    if (!file) {
        return;
    }

    selectedFile = file;

    filePreview.style.display =
        "block";

    filePreview.textContent =
        "ARCHIVO: " +
        file.name;
};


/* =========================================================
   DATA URL
========================================================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = () =>
                resolve(reader.result);

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResize() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}

input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.onclick =
    sendMessage;


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.onclick =
    createConversation;


/* =========================================================
   VOZ
========================================================= */

let recognition = null;

if (
    "webkitSpeechRecognition"
    in window ||
    "SpeechRecognition"
    in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "es-AR";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;

    recognition.onresult =
        event => {

            input.value =
                event.results[0][0].transcript;

            autoResize();
        };

    recognition.onstart =
        () => {

            micButton.style.color =
                "#5ee7ff";

            micButton.style.boxShadow =
                "0 0 18px rgba(94,231,255,.25)";
        };

    recognition.onend =
        () => {

            micButton.style.color =
                "";

            micButton.style.boxShadow =
                "";
        };
}

micButton.onclick = () => {

    if (!recognition) {

        alert(
            "El reconocimiento de voz no está disponible en este navegador."
        );

        return;
    }

    recognition.start();
};


/* =========================================================
   INICIATIVA DE ALICIA
========================================================= */

let initiativeTimer = null;

let initiativeRunning = false;

let lastInitiative =
    Date.now();


function scheduleInitiative() {

    clearTimeout(
        initiativeTimer
    );

    const delay =
        120000 +
        Math.random() * 180000;

    initiativeTimer =
        setTimeout(
            checkInitiative,
            delay
        );
}


async function checkInitiative() {

    if (initiativeRunning) {
        scheduleInitiative();
        return;
    }

    const conversation =
        getActiveConversation();

    if (
        !conversation ||
        conversation.messages.length < 2
    ) {

        scheduleInitiative();
        return;
    }

    if (
        Date.now() -
        lastInitiative <
        120000
    ) {

        scheduleInitiative();
        return;
    }

    initiativeRunning = true;

    try {

        const history =
            conversation.messages
                .slice(-30);

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initiative: true,
                            history: history
                        })
                }
            );

        const data =
            await response.json();


        if (
            data?.ok &&
            data?.response
        ) {

            const answer =
                data.response.trim();


            if (
                answer &&
                answer !==
                "NO_INITIATIVE"
            ) {

                conversation.messages.push({
                    role: "assistant",
                    content: answer
                });

                saveState();

                renderMessages();

                lastInitiative =
                    Date.now();
            }
        }

    } catch (error) {

        console.error(
            "Alicia initiative:",
            error
        );

    } finally {

        initiativeRunning = false;

        scheduleInitiative();
    }
}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

if (
    conversations.length === 0
) {

    createConversation();

} else {

    if (
        !activeConversationId ||
        !getActiveConversation()
    ) {

        activeConversationId =
            conversations[0].id;

        saveState();
    }

    renderConversations();

    renderMessages();
}

scheduleInitiative();

</script>
